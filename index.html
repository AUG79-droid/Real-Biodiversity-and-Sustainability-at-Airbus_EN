  if(hasLead) return `<div class="highlight"><div class="leadrow"><div class="dot" style="background:${accent}"></div><p><strong>${esc(parts.lead)}</strong> ${esc(parts.rest)}</p></div></div>`;
  return `<div class="para"><p>${esc(trimmed)}</p></div>`;
}
function homeHtml(){
  const c=DATA.course, mods=DATA.modules;
  return `<section class="grid-home"><div class="hero"><div class="hero-grid"><div class="hero-copy"><div class="chips"><span class="chip">Sustainability in aviation</span></div><div style="height:20px"></div><h1>Sustainability,<br>evidence<br>and informed judgement.</h1><p>${esc(c.intro)}</p><button class="cta" onclick="goProgram()">Open programme →</button></div><div class="map hero-map"><div class="eyebrow">Course map</div>${mods.map(m=>`<div class="map-card"><div class="map-line"><div class="map-badge">${icons[m.id]||'•'}</div><div><div class="eyebrow" style="color:rgba(255,255,255,.45)">${esc(m.index)}</div><div style="margin-top:4px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.88)">${esc(m.title)}</div></div></div></div>`).join('')}</div></div></div><div class="side-card"><div class="eyebrow">Structure</div><h2 style="margin:12px 0 0;font-size:36px;line-height:1.02;letter-spacing:-.02em;color:#1a1d23">How it is organised</h2><div style="margin-top:24px;display:grid;gap:12px">${c.structure.map((item,i)=>`<div class="small-card"><div style="display:flex;gap:12px;align-items:flex-start"><div class="counter">0${i+1}</div><p style="margin:0;font-size:14px;line-height:2;color:#475569">${esc(item)}</p></div></div>`).join('')}</div></div></section>`;
}
function programHtml(){
  const mods=DATA.modules;
  const completed=mods.filter(m=>state.completed[m.id]).length;
  const progress=Math.round((completed/mods.length)*100);
  return `<section class="program-header"><div class="eyebrow">Programme</div><h1>Course journey</h1><p style="max-width:850px;font-size:16px;line-height:2;color:#475569">Six thematic modules with developed theory, a decision case, interactive feedback and authoritative evidence sources.</p><div style="margin-top:18px;max-width:520px"><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#475569"><span>Progress</span><strong>${completed} of ${mods.length} modules completed</strong></div><div class="progress-track" style="margin-top:8px"><div class="progress-fill" style="width:${progress}%"></div></div></div></section><div style="height:24px"></div><section class="program-list">${mods.map(m=>{
      return `<article class="program-card"><div class="program-grid"><div class="media-wrap" style="background:${m.theme.panel}">${figureHtml(m.hero,`${m.index} · hero`,m.theme,true)}</div><div class="program-body"><div class="p-top"><div style="display:flex;gap:12px;align-items:center"><div class="module-icon" style="background:${m.theme.soft}">${icons[m.id]||'•'}</div><div><div class="eyebrow">Module ${esc(m.index)}</div><div style="margin-top:4px;font-size:14px;color:#64748b">${esc(m.duration)}</div></div></div><span class="tag" style="background:${m.theme.soft};color:${m.theme.accent}">${esc(m.tag)}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.objective)}</p><div class="section-preview">${m.sections.slice(0,4).map(s=>{const h=parseSectionHeading(s.title,s.kicker);return `<div class="section-box"><div class="eyebrow">${esc(h.eyebrow)}</div><div style="margin-top:8px;font-size:14px;line-height:1.7;color:#1f2937;font-weight:500">${esc(h.title)}</div></div>`}).join('')}</div><div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"><button class="open-btn" style="background:${m.theme.accent}" onclick="openModule('${m.id}')">Open module →</button><span style="font-size:14px;color:#64748b">Extended theory · applied case · self-assessment</span></div></div></div></article>`
    }).join('')}</section>`;
}
function articleHtml(section,module){
  const h=parseSectionHeading(section.title,section.kicker);
  const paras=(section.paragraphs||[]).map(p=>renderParagraph(p,module.theme.accent)).join('');
  if(h.isChapter) return `<section class="article-card"><div class="chapter-head" style="border-color:${module.theme.accent};background:${module.theme.panel}"><div class="eyebrow" style="color:${module.theme.accent}">${esc(h.eyebrow)}</div><h3 style="margin:12px 0 0;font-size:30px;line-height:1.08;letter-spacing:-.02em;color:#1b1e25">${esc(h.title)}</h3></div>${section.paragraphs&&section.paragraphs.length?`<div class="article-content"><div class="block-list">${paras}</div>${section.figureSrc?`<div style="margin-top:24px">${figureHtml(section.figureSrc,section.figureLabel||'Supporting evidence',module.theme,true)}</div>`:''}</div>`:''}</section>`;
  return `<section class="article-card"><div class="article-grid"><div class="article-side" style="background:${module.theme.soft}"><div><div class="eyebrow">Section</div><div style="margin-top:8px;font-size:24px;font-weight:700;color:${module.theme.accent}">${esc(h.eyebrow)}</div></div></div><div class="article-content"><h3>${esc(h.title)}</h3><div class="block-list">${paras}</div>${section.figureSrc?`<div style="margin-top:24px">${figureHtml(section.figureSrc,section.figureLabel||'Supporting evidence',module.theme,true)}</div>`:''}</div></div></section>`;
}
function choiceHtml(key,block,accent,buttonLabel='Check decision'){
  if(!block.options||!block.options.length) return '';
  return `<div class="choice-wrap" style="--choice-accent:${accent}"><div class="eyebrow">Choose one response</div><div class="choice-options" role="radiogroup" aria-label="${esc(block.title||'Decision options')}">${block.options.map((option,i)=>`<button type="button" class="choice-option" data-choice="${key}" data-index="${i}" role="radio" aria-checked="false" onclick="chooseOption('${key}',${i})"><span class="choice-letter">${String.fromCharCode(65+i)}</span><span>${esc(option)}</span></button>`).join('')}</div><button type="button" id="submit-${key}" class="choice-submit" style="background:${accent}" disabled onclick="submitChoice('${key}')">${esc(buttonLabel)}</button><div id="feedback-${key}" class="choice-feedback hidden" aria-live="polite"></div></div>`;
}
function practicalHtml(module){
  if(!module.practical) return '';
  const p=module.practical;
  return `<section class="article-card"><div class="article-grid"><div class="article-side" style="background:${module.theme.soft}"><div><div style="font-size:18px;color:${module.theme.accent}">🗂️</div><div class="eyebrow" style="margin-top:12px">Decision case</div></div></div><div class="article-content"><h3>${esc(p.title)}</h3><p style="white-space:pre-line;font-size:16px;line-height:2;color:#475569">${esc(p.intro)}</p><div class="practical-steps">${(p.steps||[]).map((s,i)=>`<div class="section-box"><div class="eyebrow">Evidence step 0${i+1}</div><p style="margin:8px 0 0;font-size:14px;line-height:2;color:#475569">${esc(s)}</p></div>`).join('')}</div>${choiceHtml('practice-'+module.id,p,module.theme.accent)}<div style="margin-top:20px" class="highlight"><p><strong>Decision principle:</strong> ${esc(p.takeaway)}</p></div></div></div></section>`;
}
function evaluationHtml(module){
  if(!module.evaluation) return '';
  const e=module.evaluation;
  return `<section class="article-card"><div class="article-grid"><div class="article-side" style="background:${module.theme.soft}"><div><div style="font-size:18px;color:${module.theme.accent}">📝</div><div class="eyebrow" style="margin-top:12px">Evaluation</div></div></div><div class="article-content"><h3>${esc(e.title)}</h3><div class="section-box" style="margin-top:20px"><div class="eyebrow">Question</div><p style="margin:12px 0 0;font-size:16px;line-height:2;color:#334155">${esc(e.question)}</p></div>${choiceHtml('quiz-'+module.id,e,module.theme.accent,'Check answer')}</div></div></section>`;
}
function sourcesHtml(module){
  if(!module.sources||!module.sources.length) return '';
  return `<section class="meta-white"><div class="eyebrow">Evidence sources</div><h3 style="margin:10px 0 0;font-size:24px;color:#1b1e25">Continue with the primary sources</h3><div class="source-list">${module.sources.map(s=>`<a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a>`).join('')}</div></section>`;
}
function moduleHtml(module){
  const nextIndex=DATA.modules.findIndex(x=>x.id===module.id)+1;
  const next=DATA.modules[nextIndex]||null;
  return `<div class="module-layout"><aside class="sticky stack"><div class="meta-dark"><div style="display:flex;gap:12px;align-items:center"><div class="module-icon" style="border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.05)">${icons[module.id]||'•'}</div><div><div class="eyebrow" style="color:rgba(255,255,255,.45)">Module ${esc(module.index)}</div><div style="margin-top:4px;font-size:14px;color:rgba(255,255,255,.65)">${esc(module.duration)}</div></div></div><h2 style="margin:20px 0 0;font-size:28px;line-height:1.08;color:#f8f3ec">${esc(module.title)}</h2><p style="font-size:14px;line-height:2;color:rgba(255,255,255,.7)">${esc(module.objective)}</p><div style="margin-top:20px"><span class="chip">${esc(module.tag)}</span></div></div></aside><div class="stack"><section class="article-card"><div class="program-grid" style="grid-template-columns:1.05fr .95fr"><div style="padding:24px 32px;background:${module.theme.panel}"><div class="eyebrow">Module opening</div><h1 style="margin:12px 0 0;max-width:900px;font-size:58px;line-height:.98;letter-spacing:-.04em;color:#1b1e25">${esc(module.title)}</h1>${module.openingTitle&&module.openingParagraphs?`<h2 style="margin:24px 0 0;font-size:32px;line-height:1.08;letter-spacing:-.02em;color:#1b1e25">${esc(module.openingTitle)}</h2><div class="block-list" style="margin-top:16px">${module.openingParagraphs.map(p=>renderParagraph(p,module.theme.accent)).join('')}</div>`:`<p style="margin-top:20px;font-size:16px;line-height:2;color:#475569">${esc(module.objective)}</p>`}</div><div class="media-wrap" style="background:${module.theme.soft}">${figureHtml(module.hero,`${module.index} · hero`,module.theme,true)}</div></div></section>${module.sections.map(s=>articleHtml(s,module)).join('')}${practicalHtml(module)}${evaluationHtml(module)}${sourcesHtml(module)}${module.closing?`<section class="footer-close"><div class="eyebrow" style="color:rgba(255,255,255,.45)">Closing</div><p style="margin:16px 0 0;font-size:16px;line-height:2;color:rgba(255,255,255,.78)">${esc(module.closing)}</p></section>`:''}<section class="meta-white"><div class="eyebrow">Navigation</div><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center"><button class="small-card" style="padding:12px 16px;text-align:left" onclick="goProgram()">← Programme</button>${next?`<button class="open-btn" style="background:#020617;justify-content:center" onclick="openModule('${next.id}')">Next →</button>`:''}</div></section></div></div>`;
}
function setActiveNav(){ qs('#nav-home').classList.toggle('active',state.view==='home'); qs('#nav-program').classList.toggle('active',state.view==='program'||state.view.startsWith('m')); }
function render(){
  qs('#brand-title').textContent=DATA.course.title; qs('#brand-sub').textContent=DATA.course.subtitle;
  qs('#home-view').innerHTML=homeHtml();
  qs('#program-view').innerHTML=programHtml();
  qs('#module-view').innerHTML=state.currentModule?moduleHtml(state.currentModule):'';
  qs('#home-view').classList.toggle('hidden',state.view!=='home');
  qs('#program-view').classList.toggle('hidden',state.view!=='program');
  qs('#module-view').classList.toggle('hidden',!state.currentModule);
  setActiveNav();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goHome(){state.view='home'; state.currentModule=null; render();}
function goProgram(){state.view='program'; state.currentModule=null; render();}
function openModule(id){ const m=DATA.modules.find(x=>x.id===id); state.view=id; state.currentModule=m||null; render(); }
function resolveChoice(key){
  const parts=String(key).split('-'),kind=parts.shift(),id=parts.join('-');
  const module=DATA.modules.find(m=>m.id===id);
  if(!module) return null;
  return {module,block:kind==='practice'?module.practical:module.evaluation,kind};
}
function chooseOption(key,index){
  state.answers[key]=index;
  document.querySelectorAll('[data-choice="'+key+'"]').forEach(btn=>{
    const selected=Number(btn.dataset.index)===index;
    btn.classList.toggle('selected',selected);
    btn.setAttribute('aria-checked',String(selected));
  });
  const submit=document.getElementById('submit-'+key);
  if(submit) submit.disabled=false;
  const feedback=document.getElementById('feedback-'+key);
  if(feedback){feedback.className='choice-feedback hidden';feedback.textContent='';}
}
function submitChoice(key){
  const resolved=resolveChoice(key),selected=state.answers[key];
  if(!resolved||selected===undefined) return;
  const correct=selected===resolved.block.correct;
  const feedback=document.getElementById('feedback-'+key);
  if(feedback){
    feedback.textContent=correct?resolved.block.feedbackCorrect:resolved.block.feedbackIncorrect;
    feedback.className='choice-feedback '+(correct?'correct':'incorrect');
  }
  if(correct&&resolved.kind==='quiz'){
    state.completed[resolved.module.id]=true;
    try{localStorage.setItem('airbusNatureCourseProgress',JSON.stringify(state.completed));}catch{}
  }
}
window.chooseOption=chooseOption; window.submitChoice=submitChoice;
window.goHome=goHome; window.goProgram=goProgram; window.openModule=openModule;
qs('#nav-home').onclick=goHome; qs('#nav-program').onclick=goProgram;
render();
</script>
</body>
</html>
