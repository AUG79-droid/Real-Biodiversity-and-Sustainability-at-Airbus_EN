<script>
const DATA = {"course":{"title":"Sustainability in Aviation: Evidence & Decisions","subtitle":"Advanced digital course · Airbus context","intro":"A structured learning journey for aerospace employees who need to understand how climate, biodiversity, land, water and materials interact with industrial decisions. Each module connects scientific concepts to operational evidence, procurement, governance and credible communication.","structure":["Theory explained from first principles, with aerospace examples.","A decision case in every module, using fictional but realistic operational data.","An interactive knowledge check with technical feedback.","Evidence sources and clear limits on what the data can prove.","Saved progress in this browser so learners can return later."]},"modules":[{"id":"m1","index":"01","title":"Nature and Resilience as an Operational and Strategic System","objective":"Build the scientific foundation needed to distinguish climate, biodiversity, ecosystem condition, dependencies, impacts and nature-related risk—and use those distinctions in aerospace decisions.","duration":"90–110 min","tag":"System foundations","theme":{"ink":"#15202b","panel":"#fbf7f0","soft":"#efe5d8","line":"#c99a5b","accent":"#30495c"},"hero":"images/m1/m1-caso.jpg","support":"images/m1/m1-apoyo.jpg","case":"images/m1/m1-caso.jpg","openingTitle":"1. Why carbon accounting alone is not enough","openingParagraphs":["Climate change and biodiversity loss are connected, but they are not interchangeable. Carbon accounting tracks greenhouse-gas flows; biodiversity assessment asks what is happening to genes, species, ecosystems and the ecological processes that keep them functioning. A project can reduce emissions and still damage a wetland, fragment habitat or increase water stress. Equally, a restoration project can improve local ecological condition without cancelling an unrelated climate impact.","For aerospace employees, the practical question is not whether nature is important in the abstract. It is where an activity depends on water, biological materials, stable soils, flood regulation or other ecosystem services; where it creates pressures; and how those relationships can become operational, legal, financial or reputational risks. This module establishes the vocabulary and decision logic used throughout the course."],"sections":[{"kicker":"Chapter","title":"2. CHAPTER 1.1: The scientific framework: how does the Earth system work?","paragraphs":[]},{"kicker":"1.1.1","title":"1.1.1: Ecosystem services: Airbus’s invisible infrastructure","paragraphs":["For an aviation professional, infrastructure means runways, hangars and satellites. For the planet, infrastructure means ecosystem services: the benefits nature provides free of charge and without which Airbus could not operate.","1. Regulating services: forests and oceans absorb around 50% of our CO2 emissions. They are natural carbon sinks. If the biodiversity of those systems degrades because of fires, pests or deforestation, more CO2 remains in the atmosphere, warming accelerates and flight conditions become more dangerous and more expensive.","2. Provisioning services: nature supplies physical materials. That includes freshwater for surface treatment in our plants and, critically, biological materials such as natural rubber.","3. Supporting services: processes such as nutrient cycling and soil formation that sustain the economic stability of the regions where Airbus operates and where its customers are based."],"figureSrc":"images/m1/m1-apoyo.jpg","figureLabel":"Invisible infrastructure"},{"kicker":"1.1.2","title":"1.1.2: The 9 planetary boundaries: the global flight envelope","paragraphs":["To understand the urgency inside Airbus, we need the concept of Planetary Boundaries. This framework was created in 2009 by the Stockholm Resilience Centre to define the thresholds humanity should not cross if it wants to maintain Earth system stability.","Imagine that Earth has a flight envelope. When an aircraft leaves it, it enters stall conditions or structural risk. Scientists have identified nine boundaries that act like our flight indicators:","1. Climate change: measures atmospheric CO2 concentration. (Exceeded).","2. Biosphere integrity (biodiversity): measures species extinction. It is the most critical boundary. (Severely exceeded).","3. Land-system change: conversion of forests into farms. (Exceeded).","4. Freshwater use: alteration of rivers and aquifers. (Exceeded).","5. Biogeochemical flows: excess nitrogen and phosphorus in water. (Exceeded).","6. Novel entities: pollution from plastics, chemicals and synthetic materials. (Exceeded).","7. Ocean acidification: the sea becomes more acidic as it absorbs CO2, killing coral systems.","8. Stratospheric ozone depletion: the only boundary showing recovery.","9. Atmospheric aerosol loading: dust and smoke particles that alter climate behaviour.","Why does this matter for Airbus? Because six of the nine boundaries have already been crossed. In practice, we are operating in turbulent air. Crossing those limits creates climate and resource unpredictability that undermines financial and logistics planning for any industrial company."],"figureSrc":"images/m1/m1-apoyo.jpg","figureLabel":"Planetary boundaries"},{"kicker":"1.1.3","title":"1.1.3: The life-cycle challenge and Scope 3","paragraphs":["Life-cycle thinking follows a product or programme across raw-material extraction, transformation, component manufacture, assembly, use, maintenance and end of life. The purpose is to prevent burden shifting: a lighter component may reduce fuel use while increasing mining pressure, water consumption or processing toxicity elsewhere.","For programmes such as A400M or Eurofighter, a screening assessment should not pretend to calculate a single complete biodiversity footprint from limited data. It should first map material families, locations, volumes, supplier tiers and plausible pressure pathways. High-risk combinations—such as a sensitive location, a land-intensive commodity and weak traceability—then receive deeper assessment.","* Scope 3 and the value chain: many material impacts and dependencies sit outside direct operations. Supplier questionnaires are useful, but claims require evidence such as location data, chain-of-custody records, methods, time periods and assurance.","* Decision rule: use estimates to prioritise investigation, not to present uncertain values as measured facts. Record assumptions, data gaps and confidence alongside every result."]},{"kicker":"Chapter","title":"3. CHAPTER 1.2: Strategic risks and critical dependencies","paragraphs":[]},{"kicker":"1.2.1","title":"1.2.1: Natural rubber: biological dependency and supply risk","paragraphs":["Aircraft tyres illustrate how an industrial system can depend on biodiversity through a biological raw material. Natural rubber has mechanical properties that remain important under demanding loads and thermal cycles. The learning point is not that one species automatically creates a quantified corporate risk; it is that concentrated production, genetic uniformity, disease, land-use change and weak traceability can combine into a vulnerable supply pathway.","* Dependency: certified components require material with defined performance.","* Impact pathway: poorly managed expansion of rubber plantations may contribute to habitat conversion, pollution or social conflict.","* Risk pathway: disease, extreme weather, trade disruption or loss of ecosystem condition may reduce availability or increase cost and lead time.","* Control pathway: specification review, supplier traceability, diversified sourcing, credible certification, agronomic resilience and contingency planning must be assessed together. A plantation certificate alone cannot prove that the complete risk is controlled."],"figureSrc":"images/m1/m1-caso.jpg","figureLabel":"Critical rubber dependency"},{"kicker":"1.2.2","title":"1.2.2: Reporting frameworks: what they do—and what they do not do","paragraphs":["Nature-related reporting is evolving. European Sustainability Reporting Standards include ESRS E4 on biodiversity and ecosystems when the topic is material under the applicable reporting requirements. TNFD provides voluntary recommendations and the LEAP approach for locating interfaces with nature, evaluating dependencies and impacts, assessing risks and opportunities, and preparing a response.","Frameworks organise questions; they do not manufacture evidence. A disclosure can be well structured and still be weak if locations, baselines, boundaries or methods are missing. Legal scope and phase-in provisions can also change, so employees should use the current controlled corporate interpretation rather than treating a training slide as legal advice.","* Double materiality separates impact materiality—how the undertaking affects people and nature—from financial materiality—how sustainability matters can affect enterprise value. The same event may sit in both lenses, but the evidence and decision thresholds are not identical.","* Good practice: state the reporting boundary, date, methodology, uncertainty and responsible data owner. If a claim relies on an estimate or model, say so."]},{"kicker":"1.2.3","title":"1.2.3: Governance: risks and opportunities","paragraphs":["Risks of poor management:","* Transition risk: laws may change faster than we can adapt our factories, exposing us to major penalties.","* Reputational risk: losing the trust of customers and, above all, employees. Pride of belonging falls if the company is seen as a destroyer of nature.","Strategic opportunities:","* Talent attraction: many young engineers choose companies with a real sustainability strategy. In a highly competitive talent market, leadership in biosphere protection becomes a recruitment advantage.","* Innovation and eco-design: understanding nature leads us toward biomimicry — learning from natural forms to design more efficient wings — and additive manufacturing that reduces waste of scarce, high-value materials."]},{"kicker":"1.3.1","title":"1.3.1: Nature has multiple levels—and condition matters","paragraphs":["Biodiversity includes diversity within species, between species and of ecosystems. Genetic diversity can affect resilience to disease; species diversity shapes ecological interactions; ecosystem diversity provides different habitats and functions across a landscape.","A simple species count is therefore insufficient. Two sites may contain the same number of species while differing greatly in habitat condition, abundance, connectivity and presence of threatened or invasive species. Assessment should consider at least extent, condition, connectivity and ecological importance, using indicators appropriate to the location.","* Baseline: a dated description of conditions before an intervention. Without it, change cannot be demonstrated.","* Reference condition: the ecological state used to judge degradation or recovery. It must be explicit; “greener than before” is not a method.","* Counterfactual: what would probably have happened without the action. This matters when attributing an outcome to a project rather than to rainfall, land management or another external factor."],"figureSrc":"images/m1/m1-apoyo.jpg","figureLabel":"Ecosystem condition and connectivity"},{"kicker":"1.3.2","title":"1.3.2: The five direct drivers and aerospace interfaces","paragraphs":["IPBES groups the major direct drivers of biodiversity loss into changes in land and sea use, direct exploitation of organisms, climate change, pollution and invasive alien species. Industrial activities can interact with several drivers at the same time.","Land-use change may arise from new buildings, access roads, mining or commodity production. Pollution can include nutrients, hazardous substances, noise and light as well as air emissions. Invasive species can move through freight, soil, packaging or landscaping. Climate change alters habitat suitability and can amplify other pressures.","The correct unit of analysis is the pressure pathway: activity → pressure → change in ecological state → effect on ecosystem services or species → operational or societal consequence. This chain prevents vague language and reveals which control is actually capable of interrupting the impact."]},{"kicker":"1.3.3","title":"1.3.3: The mitigation hierarchy—sequence before slogans","paragraphs":["The mitigation hierarchy starts with avoidance, then reduction, followed by restoration or regeneration; measures addressing residual impacts come last. SBTN expresses this logic through AR3T: Avoid, Reduce, Regenerate and Restore, and Transform systems.","Avoidance is usually strongest because it prevents damage before it occurs: relocating a footprint, changing timing, redesigning lighting or selecting an existing disturbed area. Reduction limits impacts that cannot yet be avoided. Restoration repairs affected ecological condition and needs a baseline, method, maintenance period and success criteria.","Compensation must never be presented as permission to skip avoidance. A hectare restored elsewhere is not automatically equivalent to a hectare lost, because habitat type, condition, connectivity, ecological function, time lag and probability of success differ. The decision record should show which options were tested and why residual impact remains."]},{"kicker":"Summary","title":"4. Module summary and conclusion","paragraphs":["This module shows that Airbus is not only a company of machines; it is a company that depends on biological systems. Understanding planetary boundaries, managing the natural-rubber dependency and complying with CSRD are not extra tasks. They are part of the foundation for our survival as an aerospace leader. Biodiversity is the insurance policy of our supply chain."]}],"practical":{"title":"Decision case: A400M support-area extension","intro":"Fictional training scenario: an A400M support facility needs 2,400 m² of additional hardstanding. Option A uses previously sealed land but adds 180 metres to internal vehicle movements. Option B is operationally convenient but removes species-rich grassland connected to a seasonal pond. Option C affects lower-condition grassland, avoids the pond buffer and needs a revised drainage design. Ecologists have only one spring survey, so uncertainty remains.","steps":["Define the operational need and non-negotiable safety constraints.","Compare avoidance alternatives before discussing planting or offsetting.","Request seasonal evidence for the pond, drainage pathway, protected species and habitat connectivity.","Document the selected option, residual impacts, controls, monitoring trigger and accountable owner."],"options":["Choose Option B and compensate by planting trees elsewhere.","Pause the final selection, test whether A or C can meet the need, close seasonal data gaps and apply the mitigation hierarchy before addressing residual impact.","Use the facility’s annual carbon footprint as the deciding biodiversity indicator."],"correct":1,"feedbackCorrect":"Correct. The evidence is incomplete, so the defensible decision is to preserve options, test avoidance and close the location-specific gaps before committing.","feedbackIncorrect":"Not yet. The proposal either skips avoidance or uses a climate metric as a biodiversity proxy. Revisit the pressure pathway and mitigation sequence.","takeaway":"Good biodiversity decisions preserve room to avoid damage while uncertainty is being reduced."},"evaluation":{"title":"Knowledge check","question":"Which statement best distinguishes biodiversity management from carbon management?","options":["A carbon reduction automatically proves that local biodiversity impact is positive.","Biodiversity requires location-specific evidence on ecological state and pressures; carbon data can inform the analysis but cannot replace it.","A species count is sufficient because ecosystem condition and connectivity are secondary."],"correct":1,"feedbackCorrect":"Correct. Climate and biodiversity interact, but their metrics, spatial scales and causal pathways are different.","feedbackIncorrect":"Review the sections on biodiversity levels, baselines and pressure pathways. One metric cannot stand in for another environmental topic."},"closing":"Technical judgement begins by separating concepts that are often merged in communication: pressure is not impact, activity is not outcome, carbon is not biodiversity, and restoration is not automatic equivalence.","sources":[{"label":"IPBES Global Assessment — biodiversity drivers and evidence base","url":"https://ipbes.net/global-assessment"},{"label":"TNFD — LEAP approach for nature-related assessment","url":"https://tnfd.global/publication/additional-guidance-on-assessment-of-nature-related-issues-the-leap-approach/"},{"label":"Science Based Targets Network — AR3T action framework","url":"https://sciencebasedtargetsnetwork.org/companies/take-action/act/"},{"label":"EFRAG Knowledge Hub — ESRS E4 Biodiversity and Ecosystems","url":"https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-e4-biodiversity-and-ecosystems/"}]},{"id":"m2","index":"02","title":"Geointelligence: Earth Observation for Environmental Decisions","objective":"Understand what optical and radar Earth observation can measure, how a monitoring chain converts pixels into evidence, and where ground verification and uncertainty controls remain essential.","duration":"90–110 min","tag":"Evidence systems","theme":{"ink":"#141c28","panel":"#f7f4ee","soft":"#dfeaf1","line":"#6d90aa","accent":"#1f3f5b"},"hero":"images/m2/m2-hero.jpg","support":"images/m2/m2-apoyo.jpg","case":"images/m2/m2-caso.jpg","openingTitle":"1. From imagery to decision-grade evidence","openingParagraphs":["Earth observation can reveal changes that are difficult, dangerous or expensive to monitor only from the ground. Optical instruments record reflected energy across selected wavelengths; radar systems actively transmit a signal and can acquire information through cloud and at night. Neither system “sees biodiversity” directly. They measure physical properties from which analysts infer land cover, vegetation condition, moisture, disturbance or change.","Airbus Defence and Space builds Earth observation systems and transforms geospatial data into services for customers. The professional challenge is to prevent a technically impressive image from being treated as proof of ecological outcome. A defensible monitoring product links a management question, sensor choice, baseline, processing method, validation sample, uncertainty statement and decision threshold."],"sections":[{"kicker":"Chapter","title":"2. CHAPTER 2.1: The eyes of Earth: next-generation sensors","paragraphs":[]},{"kicker":"2.1.1","title":"2.1.1: Ultra-high-resolution optics (the detail that saves species)","paragraphs":["To manage biodiversity effectively, image resolution is the line between an assumption and legally useful evidence. In the past, low-resolution satellites could only distinguish “green patches” from “brown patches”. Airbus broke that barrier.","The Pléiades Neo constellation: the new 30 cm standard.","Airbus operates the most advanced constellation in its class: Pléiades Neo. Made up of four identical satellites, the system delivers a native 30-centimetre resolution. While public satellites such as Sentinel-2 view the world in 10-metre pixels, Pléiades Neo can detect objects about the size of a dinner plate from space.","* Species identification and forest inventory: at 30 cm resolution, geointelligence can support forest inventories without sending human teams into dangerous or inaccessible areas. Individual tree species can be inferred through canopy architecture and spectral signature analysis.","* Canopy health assessment: using specific spectral bands such as Deep Blue and Red Edge, satellites can detect water stress or disease in trees before it is visible to the human eye, enabling action against pests that could devastate entire habitats.","* Real example: Airbus works with the NGO Madagasikara Voakajy in Madagascar. High-resolution imagery is used to monitor remaining forest fragments and help protect habitat for critically endangered species such as lemurs. The ability to detect trails barely one metre wide makes human intrusion into protected sanctuaries visible."],"figureSrc":"images/m2/m2-apoyo.jpg","figureLabel":"Ultra-high-resolution optics"},{"kicker":"2.1.2","title":"2.1.2: Preventing degradation: stopping “invisible deforestation”","paragraphs":["It is essential not to confuse deforestation with forest degradation. Deforestation is total removal of a forest. Forest degradation, by contrast, is the selective removal of the most valuable trees while much of the canopy remains visually intact.","* Detecting selective logging: from low-resolution satellites a degraded forest can still look “green”. Pléiades Neo, however, detects the light gaps left when a single giant tree is removed and the narrow log landings or extraction tracks that are often less than three metres wide.","* Preventive legal intervention: detecting selective extraction allows authorities to intervene while damage is still reversible. Airbus can provide the imagery as auditable evidence in legal action against illegal logging.","* Use case: the Starling service, developed by Airbus with Earthworm Foundation, is used by multinational companies such as Nestlé and Ferrero to demonstrate that suppliers have not degraded protected areas. The system creates automated alerts based on comparisons of ultra-high-resolution imagery, reducing documentary fraud."],"figureSrc":"images/m2/m2-caso.jpg","figureLabel":"Invisible deforestation"},{"kicker":"2.1.3","title":"2.1.3: Radar vision (SAR): the shield against environmental “blindness”","paragraphs":["The most biodiverse regions on Earth, including the Congo Basin and the Amazon, are covered by clouds for more than 250 days a year. This is where Airbus synthetic aperture radar becomes indispensable.","* What is SAR radar? It is an active sensor that emits its own microwave pulses and measures the return signal. It can see through dense clouds, smoke, volcanic ash and total darkness.","* TerraSAR-X and TanDEM-X: these twin satellites fly in precise formation using interferometry to create 3D terrain models such as WorldDEM with near-millimetric accuracy.","* Biomass measurement: radar penetrates foliage to some extent and helps estimate trunk volume. That allows forests to be “weighed” and the carbon they store to be quantified, which is essential for international climate agreements.","* Reference: Airbus is the prime contractor for ESA’s Biomass mission, designed to build a global 3D inventory of forest carbon."],"figureSrc":"images/m2/m2-hero.jpg","figureLabel":"SAR radar vision"},{"kicker":"Chapter","title":"3. CHAPTER 2.2: Global partnerships and the Copernicus programme","paragraphs":["Airbus is a key industrial pillar of Copernicus, the EU and ESA Earth-observation programme."]},{"kicker":"2.2.1","title":"2.2.1: CAMS and C3S: atmosphere and climate monitoring","paragraphs":["* CAMS (atmosphere monitoring): Airbus builds instruments for Sentinel-4 and Sentinel-5 missions, tracking pollutants and forest fires. In 2023 those systems helped track smoke from the Canadian fires as it crossed the Atlantic.","* C3S (climate change): the service provides data on sea-level rise through Sentinel-6 and on soil moisture. Airbus Protect uses these datasets to assess infrastructure risk at airports and to support the design of nature-based flood defences."],"figureSrc":"images/m2/m2-apoyo.jpg","figureLabel":"Atmospheric and climate monitoring"},{"kicker":"2.2.2","title":"2.2.2: Collaboration with IUCN: verifying restoration","paragraphs":["Airbus provides independent MRV — monitoring, reporting and verification — for reforestation projects.","* Seedling survival: with 30 cm imagery, it becomes possible to verify individually whether planted trees survive during the first 24 months.","* Real example: Atlantic Forest restoration in Brazil, reconnecting forest fragments in order to secure the genetic diversity of fauna."],"figureSrc":"images/m2/m2-caso.jpg","figureLabel":"Restoration verification"},{"kicker":"Chapter","title":"4. CHAPTER 2.3: Application cases and real-world impact","paragraphs":[]},{"kicker":"2.3.1","title":"2.3.1: Monitoring “dark vessels” (ocean protection)","paragraphs":["Illegal vessels switch off their identification system (AIS) in order to plunder marine sanctuaries.","* The Airbus solution: we cross-check the physical echo detected by radar, such as TerraSAR-X, against AIS signals. If radar sees a ship where there is no AIS signal, it is a dark vessel. We can then task an optical satellite to identify hull markings and gear in collaboration with Global Fishing Watch."],"figureSrc":"images/m2/m2-hero.jpg","figureLabel":"Ocean protection"},{"kicker":"2.3.2","title":"2.3.2: “Satellites for Biodiversity” awards","paragraphs":["We support scientists using space data to monitor chimpanzee habitats and protect the Andean bear in extreme field conditions."]},{"kicker":"Chapter","title":"5. CHAPTER 2.4: The future: NEXT SPACE and planetary protection","paragraphs":[]},{"kicker":"2.4.1","title":"2.4.1: Space sustainability and orbital debris","paragraphs":["We design satellites under space eco-design principles so they disintegrate safely at end of life, and we participate in orbital clean-up initiatives such as CleanSpace."]},{"kicker":"2.4.2","title":"2.4.2: Committee on Planetary Protection (CoPP)","paragraphs":["We follow COSPAR protocols to prevent biological contamination:","1. Forward contamination: avoiding the transfer of terrestrial microbes to other worlds, for example on the JUICE mission to Jupiter.","2. Backward contamination: sealing samples returned from other planets in order to protect Earth’s biosphere, as in Mars Sample Return concepts."]},{"kicker":"2.5.1","title":"2.5.1: Observation is not attribution","paragraphs":["A satellite time series may show that canopy cover decreased after a date. It does not, by itself, prove who caused the change, whether habitat quality declined in the same proportion, or whether a corporate action produced the result. Attribution requires a causal hypothesis, contextual data and often field evidence.","Three distinctions protect decision quality. Detection asks whether a change is visible. Classification asks what type of change it is. Attribution asks why it happened and whether a particular action caused it. Each step introduces uncertainty, and each may require different evidence.","* False positive: the system flags change that did not occur, perhaps because of cloud shadow, seasonal water or a classification error.","* False negative: real degradation is missed because it is smaller than the spatial resolution, occurs under the canopy or falls between acquisition dates.","* Decision threshold: the level of evidence that triggers field inspection, supplier engagement, corrective action or escalation. It should be defined before reviewing the most convenient image."]},{"kicker":"2.5.2","title":"2.5.2: The monitoring chain—from question to control","paragraphs":["A reliable workflow starts with the decision, not the sensor. First define the asset, habitat or supply area and the management question. Then establish a dated baseline and select indicators that respond to the relevant pressure. Only after that should the team choose spatial resolution, revisit frequency, spectral bands, radar geometry and acquisition timing.","Processing must be reproducible: document data source, atmospheric or radiometric correction, algorithm version, training data and quality checks. Validation should compare outputs with independent field observations or higher-confidence reference data. Results then need an uncertainty range and a threshold linked to action.","The final step is governance. A dashboard without an owner is not a control. Specify who reviews alerts, who verifies them, what evidence is retained, when a finding is escalated and how closure is confirmed. Geointelligence becomes valuable when it shortens the path from weak signal to proportionate decision."],"figureSrc":"images/m2/m2-hero.jpg","figureLabel":"From geospatial data to decision"},{"kicker":"Sources","title":"Source list and references: Airbus module 2","paragraphs":[]},{"kicker":"1","title":"1. Primary Airbus documentation","paragraphs":["* Airbus Defence and Space (2024): Geointelligence: Space Technology as a Protector of the Biosphere. Technical report on the use of satellite constellations for environmental monitoring.","* Airbus Intelligence (2024): Pléiades Neo: Technical Specifications and User Guide. Details on 30 cm resolution and spectral bands.","* Airbus Protect (2024): Climate Risk Assessment for Infrastructure. Methodologies for using climate data to improve asset resilience.","* Airbus internal document: Next Space Initiative: Sustainable Exploration and Planetary Protection.","* Airbus Committee on Planetary Protection (CoPP): Procedures and COSPAR compliance manual."]},{"kicker":"2","title":"2. International programmes and institutions","paragraphs":["* Copernicus Programme (ESA / European Commission).","* CAMS (Copernicus Atmosphere Monitoring Service): data on aerosols, wildfires and air quality.","* C3S (Copernicus Climate Change Service): essential climate variables and forecasting models.","* ESA: Biomass mission (P-band SAR) and Sentinel-6 sea-level documentation.","* IUCN: Restoration Barometer methodology for land-restoration commitments.","* ECMWF: support data for Copernicus services."]},{"kicker":"3","title":"3. Scientific and regulatory frameworks","paragraphs":["* COSPAR (Committee on Space Research): Policy on Planetary Protection.","* Stockholm Resilience Centre: Planetary Boundaries framework.","* ISO 14040 / 14044: international standards for Life Cycle Assessment applied to satellites and aircraft.","* MDPI Encyclopedia: Life Cycle Assessment in Aviation."]},{"kicker":"4","title":"4. Use cases and technical applications","paragraphs":["* Earthworm Foundation: Starling methodology for monitoring deforestation in raw-material supply chains.","* Global Fishing Watch: dark-vessel detection through AIS and SAR cross-analysis.","* Madagasikara Voakajy: Pléiades-based habitat protection for lemurs in Madagascar.","* Connected Conservation Foundation: reports from Satellites for Biodiversity award winners."]},{"kicker":"5","title":"5. References for specific missions","paragraphs":["* JUICE mission: cleaning and sterilisation protocols for icy-moon exploration.","* TerraSAR-X & TanDEM-X: SAR interferometry fundamentals and WorldDEM generation.","* Mars Sample Return concepts: Earth Return Orbiter design and sample-containment safety protocols."]}],"practical":{"title":"Decision case: seasonal wetland monitoring","intro":"Fictional scenario: a seasonal wetland lies near a test-support corridor. Optical imagery is available monthly but cloud cover affected four recent acquisitions. A radar series shows a change in surface response, while two field visits disagree about the wet area because they occurred in different seasons. The team must decide whether drainage works may proceed.","steps":["Restate the decision and define the ecological feature and time window that matter.","Build a seasonal baseline using comparable dates rather than a single image.","Combine optical and radar evidence, then target field verification to the uncertain zone.","Define the stop/go threshold and record limitations before authorising work."],"options":["Use the clearest optical image and ignore older data because it has lower resolution.","Combine the time series, harmonise seasonality, validate the radar interpretation in the field and apply a pre-agreed decision threshold.","Average the optical and radar pixel values into one score and treat it as species abundance."],"correct":1,"feedbackCorrect":"Correct. Multiple sensors reduce blind spots, but seasonal alignment, field validation and a decision threshold are still required.","feedbackIncorrect":"Not yet. A single image or an invented composite score cannot resolve seasonality, ecological meaning and attribution.","takeaway":"Remote sensing is strongest when used as part of an evidence chain, not as a substitute for ecological interpretation."},"evaluation":{"title":"Knowledge check","question":"What can synthetic-aperture radar contribute to biodiversity monitoring?","options":["It directly identifies every species under the canopy.","It can provide weather-independent measurements of structure, moisture or change, but ecological interpretation still requires validation.","It makes baselines and field surveys unnecessary."],"correct":1,"feedbackCorrect":"Correct. Radar can reduce observation gaps, especially under cloud or darkness, but it does not remove the need for ecological validation.","feedbackIncorrect":"Review the distinction between physical measurement, ecological inference and causal attribution."},"closing":"The value of geointelligence is not the beauty of an image. It is a traceable chain from a defined question to a controlled decision, with uncertainty made visible.","sources":[{"label":"Airbus — Earth observation satellites and imagery","url":"https://www.airbus.com/en/products-services/space/earth-observation"},{"label":"Airbus — Satellite imagery: optical and radar capabilities","url":"https://www.airbus.com/en/products-services/space/earth-observation/satellite-imagery"},{"label":"Copernicus — European Earth observation programme","url":"https://www.copernicus.eu/en/about-copernicus"},{"label":"TNFD — Guidance on nature-related assessment","url":"https://tnfd.global/publication/additional-guidance-on-assessment-of-nature-related-issues-the-leap-approach/"}]},{"id":"m3","index":"03","title":"Land Use, Supply Chains and Natural Capital","objective":"Learn how location, commodity, supplier tier and ecological condition shape nature-related dependencies and impacts—and how to prioritise deeper due diligence without pretending that incomplete data are precise.","duration":"95–115 min","tag":"Value-chain risk","theme":{"ink":"#20180f","panel":"#fcf7ef","soft":"#f2dfc5","line":"#bb7d31","accent":"#6d4a1d"},"hero":"images/m3/m3-hero.jpg","support":"images/m3/m3-apoyo.jpg","case":"images/m3/m3-caso.jpg","openingTitle":"1. Why an industrial footprint extends beyond the factory gate","openingParagraphs":["An aerospace product connects mines, smelters, chemical plants, composite processing, electronics, biological materials, logistics, assembly, maintenance and end of life. The biodiversity interface is therefore distributed across locations and supplier tiers. A corporate average can hide a severe local issue; a detailed local map can still miss an upstream commodity pathway.","The objective is not to attach one universal biodiversity score to every component. It is to create a repeatable prioritisation process: identify material flows and locations, screen plausible pressures and dependencies, test evidence quality, investigate high-risk combinations and connect findings to procurement or engineering decisions."],"sections":[{"kicker":"Chapter","title":"2. CHAPTER 3.1: From activity to nature-related consequence","paragraphs":[]},{"kicker":"3.1.1","title":"3.1.1: The pressure–state–service–business chain","paragraphs":["An activity becomes decision-relevant through a causal chain. Extraction, construction, discharge, transport or sourcing creates a pressure such as habitat conversion, water withdrawal, pollution, disturbance or species introduction. The pressure changes ecological state—for example habitat extent, water quality, abundance or connectivity. That state change can affect ecosystem services and people, and may then create operational, legal, financial or reputational consequences.","Starting with the chain prevents two errors. The first is jumping directly from an activity to a claim of biodiversity loss without evidence. The second is measuring an easy response—such as volunteer hours—while ignoring the pressure that drives the impact.","* Leading indicators show whether controls are being implemented: percentage of priority suppliers with verified coordinates, completion of seasonal surveys, or closure of corrective actions.","* Lagging indicators show what happened to ecological state: habitat condition, water-quality variables, abundance of an indicator species or change in fragmentation.","* Context indicators describe external conditions such as drought, regional land conversion or protected-area status. They help interpretation but are not automatically attributable to the company."],"figureSrc":"images/m3/m3-hero.jpg","figureLabel":"Land use and ecological context"},{"kicker":"3.1.2","title":"3.1.2: Location matters more than a generic hectare","paragraphs":["Biodiversity is spatially heterogeneous. One hectare of already sealed industrial land is not equivalent to one hectare of connected wetland, mature woodland or habitat used by a threatened species. Timing also matters: disturbance during a breeding season may create a different risk from the same activity at another time.","Screening should therefore combine footprint or sourcing location with ecological context. Useful layers include habitat type and condition, protected or internationally recognised areas, threatened species ranges, water stress, connectivity, restoration potential and cumulative pressures from other actors.","Maps are not verdicts. Datasets have different dates, resolutions and error rates. A mapped overlap is a reason to investigate; absence from a coarse map is not proof of absence. The decision record should state which layers were used and where field evidence is still required."]},{"kicker":"Chapter","title":"3. CHAPTER 3.2: Prioritising the upstream value chain","paragraphs":[]},{"kicker":"3.2.1","title":"3.2.1: Material family × location × control quality","paragraphs":["A practical screening model uses three dimensions. Material family indicates plausible pressure pathways: mining and refining, petrochemicals, biological commodities, electronics, packaging or energy. Location provides ecological sensitivity and jurisdictional context. Control quality assesses traceability, supplier evidence, certification scope, assurance and corrective-action capacity.","High volume alone does not define priority. A lower-volume material sourced from a highly sensitive location with poor traceability may deserve earlier investigation than a larger flow from a well-controlled recycled source. Conversely, a high-risk commodity label should not condemn every supplier; controls and site evidence matter.","The output should be a risk tier and an evidence request, not a public claim. Tier 1 may require coordinates, chain-of-custody information, permits, water data and an improvement plan. Tier 2 may require confirmation and periodic monitoring. Tier 3 may be tracked using standard procurement controls."]},{"kicker":"3.2.2","title":"3.2.2: Traceability and chain of custody","paragraphs":["Supplier declarations answer who supplied a part, but biodiversity questions often require where the underlying material came from and how it was transformed. The chain becomes difficult when traders mix sources, recycled and virgin content are combined, or Tier 1 suppliers cannot see beyond their own direct vendors.","Evidence strength increases from unverified declaration to documented traceability, independent assurance and, where appropriate, spatial monitoring. Certification can support due diligence, but the scheme scope, audit frequency, excluded operations and grievance process must be understood.","Procurement clauses should specify the information needed, the right to verify it, retention periods, escalation triggers and improvement expectations. Engineering and procurement must work together: a specification that unintentionally prevents a lower-impact material cannot be solved by supplier engagement alone."],"figureSrc":"images/m3/m3-apoyo.jpg","figureLabel":"Traceability and land management"},{"kicker":"3.2.3","title":"3.2.3: Natural capital is useful—but not a single price tag","paragraphs":["Natural capital describes stocks of natural resources and ecological systems that generate flows of benefits. The concept can help business teams recognise dependencies that conventional asset registers omit, such as water regulation or erosion control.","Monetisation can support some comparisons, but it must not erase ecological limits or rights. Market price, replacement cost and social value answer different questions. Some losses are not meaningfully interchangeable, and a financial estimate does not convert an unacceptable ecological impact into an acceptable one.","Use valuation as one input alongside ecological significance, legal protection, stakeholder rights, uncertainty and reversibility. State the method and avoid adding incompatible values into a single impressive but opaque number."]},{"kicker":"Chapter","title":"4. CHAPTER 3.3: Controls and supplier decisions","paragraphs":[]},{"kicker":"3.3.1","title":"3.3.1: Apply the mitigation hierarchy upstream","paragraphs":["Avoidance in a supply chain may mean changing a material source, excluding conversion of critical habitat, redesigning a component, increasing recycled content where performance permits or using an existing disturbed site. Reduction may involve water recirculation, pollution control, lower-impact extraction methods or improved logistics.","Restoration at a supplier site should specify the affected habitat, baseline, target condition, maintenance period, monitoring method and remedy if performance is not achieved. Purchasing certificates or supporting an unrelated conservation project does not by itself reduce the pressure in the product pathway.","A credible sourcing decision records trade-offs: performance and safety requirements, volume, location, evidence confidence, alternatives tested, residual impact and the next review date. Where evidence is weak, the response should be proportionate—request better data, change contract conditions, audit, collaborate on improvement or, when necessary, change source."],"figureSrc":"images/m3/m3-caso.jpg","figureLabel":"Industrial site and surrounding habitat"},{"kicker":"5","title":"5. Module summary","paragraphs":["Value-chain biodiversity management is a prioritisation discipline. It combines material knowledge, spatial context, traceability and control quality; it keeps uncertainty visible; and it links high-risk findings to engineering, procurement and supplier-development actions."]}],"practical":{"title":"Decision case: incomplete supplier evidence","intro":"Fictional scenario: two suppliers offer a natural-rubber component meeting the same technical specification. Supplier A is cheaper and provides a generic sustainability certificate but no plantation coordinates. Supplier B provides chain-of-custody records to grouped smallholders, mapped sourcing areas, a no-conversion control, audit results and an open corrective action on water management. A third redesign option could reduce virgin material demand by 12%, but qualification would take nine months.","steps":["Separate technical conformity from nature-related evidence.","Compare location, traceability, control scope and unresolved findings.","Evaluate the redesign as an avoidance/reduction pathway without compromising safety.","Record the interim purchasing control and the evidence required at the next gate."],"options":["Select Supplier A because a certificate removes the need for location data.","Use Supplier B’s stronger evidence provisionally, manage the open water action, and launch qualification of the demand-reduction option.","Reject all natural material immediately, regardless of performance and alternative impacts."],"correct":1,"feedbackCorrect":"Correct. The option recognises stronger traceability, treats the unresolved issue as a control action and keeps a reduction pathway open.","feedbackIncorrect":"Not yet. Certification does not erase evidence gaps, and substitution without life-cycle analysis may shift the impact.","takeaway":"Good due diligence combines present controls with a credible path to reduce the underlying pressure."},"evaluation":{"title":"Knowledge check","question":"Which combination is most useful for prioritising supplier biodiversity due diligence?","options":["Annual spend only.","Material pressure pathway, sourcing location, ecological sensitivity, traceability and control quality.","The supplier’s total carbon emissions only."],"correct":1,"feedbackCorrect":"Correct. Priority emerges from the interaction between the material, the place and the strength of controls.","feedbackIncorrect":"Review the screening model. Cost and carbon can be relevant, but neither captures the location-specific biodiversity pathway."},"closing":"The purpose of screening is disciplined attention: put scarce investigative effort where material pressure, sensitive location and weak evidence coincide.","sources":[{"label":"IPBES — Global Assessment on biodiversity and ecosystem services","url":"https://ipbes.net/global-assessment"},{"label":"TNFD — Nature-related dependencies, impacts, risks and opportunities","url":"https://tnfd.global/"},{"label":"Science Based Targets Network — corporate action for nature","url":"https://sciencebasedtargetsnetwork.org/companies/take-action/"},{"label":"EFRAG — ESRS E4 Biodiversity and Ecosystems","url":"https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-e4-biodiversity-and-ecosystems/"}]},{"id":"m4","index":"04","title":"Governance, Participation and Operational Culture","objective":"Understand how formal decision rights, competent functions and employee participation work together so that biodiversity observations become verified actions rather than isolated good intentions.","duration":"75–90 min","tag":"Governance","theme":{"ink":"#17221c","panel":"#f7f5ee","soft":"#dce8df","line":"#6a9a7b","accent":"#315645"},"hero":"images/m4/m4-hero.jpg","support":"images/m4/m4-apoyo.jpg","case":"images/m4/m4-caso.jpg","openingTitle":"1. Participation needs a system","openingParagraphs":["Employees often notice changes before a dashboard does: unusual wildlife mortality, standing water after works, recurring noise at a sensitive time, an invasive plant near a loading area or a supplier claim that does not match the evidence. That local awareness is valuable, but it becomes a control only when there is a route for verification, ownership, escalation and closure.","A biodiversity community can strengthen organisational learning and connect people across functions. It must not replace environmental specialists, site management, health and safety, procurement or programme governance. The design challenge is to combine distributed observation with clear authority and technical competence."],"sections":[{"kicker":"Chapter","title":"2. CHAPTER 4.1: Governance architecture","paragraphs":[]},{"kicker":"4.1.1","title":"4.1.1: Decision rights and accountable ownership","paragraphs":["Governance answers four questions: who notices, who assesses, who decides and who verifies closure. Confusion arises when everyone is invited to participate but nobody owns the decision, or when an enthusiastic network makes commitments outside its competence.","For each material topic, define an accountable owner, technical reviewers, consulted functions and people who must be informed. The exact model may differ by site or programme, but responsibility should be visible. A decision log should capture evidence, alternatives, approval, residual risk, action owner and review date.","Escalation thresholds are equally important. A suspected protected-species issue, pollution event or permit deviation should not wait for a community meeting. The route must connect immediately to the controlled environmental or safety process."],"figureSrc":"images/m4/m4-hero.jpg","figureLabel":"Cross-functional governance"},{"kicker":"4.1.2","title":"4.1.2: Three complementary layers of responsibility","paragraphs":["The first layer is operational ownership: teams that design, purchase, build, maintain or manage a site control the activity and implement requirements. The second layer provides specialist guidance, standards, challenge and oversight. The third layer offers independent assurance that controls and reporting are reliable.","Employee networks sit alongside these layers as a learning and sensing mechanism. They can surface local knowledge, share methods, connect colleagues and develop proposals. They should have a named sponsor, a technical contact and a clear boundary between awareness, recommendation and formal approval.","This separation protects both credibility and participation. People can contribute without being expected to make ecological judgements beyond their training, and technical teams gain a broader flow of observations and ideas."]},{"kicker":"Chapter","title":"3. CHAPTER 4.2: From observation to verified action","paragraphs":[]},{"kicker":"4.2.1","title":"4.2.1: A simple observation workflow","paragraphs":["A useful report describes what was observed, where, when, under what conditions and, where safe and permitted, includes a photograph. It avoids diagnosing a species or cause unless the observer is competent to do so.","Triage then checks urgency, legal or safety implications, duplication and the responsible function. A specialist validates the issue and defines proportionate action. Closure records what was done and whether the condition improved. Feedback to the observer completes the learning loop.","* Observe: record facts, not conclusions.","* Triage: route urgent and routine signals differently.","* Verify: use competent evidence and, if necessary, field inspection.","* Act: assign a control with owner and due date.","* Close and learn: confirm effectiveness and share the result."],"figureSrc":"images/m4/m4-apoyo.jpg","figureLabel":"Observation and learning network"},{"kicker":"4.2.2","title":"4.2.2: Psychological safety and constructive challenge","paragraphs":["People report weak signals when they believe questions will be taken seriously and mistakes will not be hidden. Psychological safety does not mean lowering technical standards; it means allowing uncertainty to be expressed early enough for evidence to be gathered.","Leaders can support this by asking what is known, what is assumed and what would change the decision. Teams should reward useful escalation even when investigation later shows that the risk was lower than expected. Punishing every false alarm encourages silence and creates larger surprises.","Constructive challenge is especially important for sustainability claims. A colleague who asks for the baseline, boundary or source is improving the work, not blocking communication."]},{"kicker":"Chapter","title":"4. CHAPTER 4.3: Measuring participation without vanity metrics","paragraphs":[]},{"kicker":"4.3.1","title":"4.3.1: Outputs, outcomes and learning","paragraphs":["Numbers of events, volunteers or ideas are output indicators. They show activity, not ecological benefit. Outcome indicators might include verified observations resolved, controls improved, time from signal to triage, supplier evidence gaps closed or reduction in a defined pressure.","A balanced dashboard uses both. Output measures help manage reach and capacity; outcome measures test whether participation changes decisions. Qualitative learning is also valuable: recurring themes may reveal a procedure that needs redesign or a data field missing from a procurement system.","Avoid converting every contribution into an environmental claim. If a habitat outcome has not been measured, describe the governance or learning result accurately."],"figureSrc":"images/m4/m4-caso.jpg","figureLabel":"Local action with technical support"},{"kicker":"5","title":"5. Module summary","paragraphs":["Participation becomes operational when observations enter a controlled workflow, decisions have accountable owners, specialists verify ecological meaning and feedback closes the loop. Community is an amplifier of governance—not a substitute for it."]}],"practical":{"title":"Decision case: an observation near the loading area","intro":"Fictional scenario: a colleague photographs several unfamiliar plants beside a loading area after imported equipment was unpacked. The plants may be harmless; they may also indicate an invasive species pathway. The colleague posts the image in a community channel, but there is no confirmed identification.","steps":["Preserve the location and date of the observation.","Avoid moving soil or plant material until triage is complete.","Route the report to the site environmental owner for competent identification.","Record the decision and share verified learning without naming the species prematurely."],"options":["Launch a public eradication campaign immediately based on the photograph.","Thank the observer, prevent accidental spread, route the record for specialist verification and act according to the confirmed result.","Ignore the report because employee observations are not formal data."],"correct":1,"feedbackCorrect":"Correct. The response preserves evidence, controls a plausible pathway and uses competent verification before making a claim.","feedbackIncorrect":"Not yet. Good governance avoids both overreaction and dismissal; it turns the signal into a controlled assessment.","takeaway":"A strong reporting culture moves quickly while keeping facts, hypotheses and decisions separate."},"evaluation":{"title":"Knowledge check","question":"What is the most defensible role for an employee biodiversity network?","options":["Replace the formal environmental-management function.","Act as a learning and sensing network connected to named technical owners and escalation routes.","Approve external biodiversity claims independently."],"correct":1,"feedbackCorrect":"Correct. Participation adds reach and local knowledge while formal owners retain technical and decision authority.","feedbackIncorrect":"Review the governance architecture. Networks strengthen controls when their remit and escalation routes are explicit."},"closing":"Authentic participation is not defined by a logo or a volunteer count. It is defined by whether people can surface evidence, reach the right owner and see that action is completed.","sources":[{"label":"TNFD — governance and risk-management disclosure recommendations","url":"https://tnfd.global/recommendations/"},{"label":"ISO — ISO 14001 environmental management systems overview","url":"https://www.iso.org/iso-14001-environmental-management.html"},{"label":"IPBES — assessments and knowledge on biodiversity","url":"https://ipbes.net/assessing-knowledge"}]},{"id":"m5","index":"05","title":"Measurement, Reporting and Credible Communication","objective":"Learn how to build decision-useful indicators, distinguish evidence from claims, apply double materiality and communicate progress without hiding boundaries, uncertainty or residual impacts.","duration":"90–105 min","tag":"Evidence and claims","theme":{"ink":"#1a1823","panel":"#f8f5fb","soft":"#e8def4","line":"#8b68b7","accent":"#463065"},"hero":"images/m5/m5-hero.jpg","support":"images/m5/m5-apoyo.jpg","case":"images/m5/m5-caso.jpg","openingTitle":"1. Credibility is an evidence architecture","openingParagraphs":["Greenwashing is not prevented by replacing ambitious words with cautious words. It is prevented by a chain of evidence: a defined subject and boundary, a dated baseline, an appropriate metric, a transparent method, accountable ownership, quality control and a claim that does not exceed what the evidence supports.","Climate, circularity, water and biodiversity can sit within one sustainability strategy, but they require different indicators. Combining them into a single score may help prioritisation only if the method and trade-offs are visible. It must not imply that improvement in one topic automatically neutralises harm in another."],"sections":[{"kicker":"Chapter","title":"2. CHAPTER 5.1: Build the metric before the message","paragraphs":[]},{"kicker":"5.1.1","title":"5.1.1: Boundary, baseline, unit and time period","paragraphs":["Every indicator needs a boundary: which sites, suppliers, products, activities and value-chain stages are included. It also needs a baseline date or reference period, a unit and a reporting frequency. Without those elements, a percentage improvement cannot be interpreted.","A biodiversity indicator may describe pressure, ecological state, response or governance. Examples include hectares of habitat converted, water-quality parameters, condition of a defined habitat, number of priority suppliers with verified sourcing coordinates, or percentage of corrective actions closed on time.","Do not mix unlike units without explaining the model. A global index can support screening, but a score is not a substitute for the underlying measurements when a decision affects a specific place."],"figureSrc":"images/m5/m5-apoyo.jpg","figureLabel":"Evidence, boundary and method"},{"kicker":"5.1.2","title":"5.1.2: Pressure, state, response and attribution","paragraphs":["Pressure indicators are often the closest to operational control: land disturbed, water withdrawn, pollutant load, night-light intensity or virgin material demand. State indicators describe ecological condition. Response indicators describe actions, such as completion of avoidance controls or restoration maintenance.","A response is not an outcome. Planting seedlings records an action; survival, habitat structure and ecological function over time describe performance. Even then, attribution should be tested against weather, background trends and other land managers.","When causality is uncertain, use precise language: “associated with”, “observed within the monitored area” or “consistent with” may be defensible where “caused by” is not."]},{"kicker":"5.1.3","title":"5.1.3: Data quality and an evidence ladder","paragraphs":["Evidence can be ranked by fitness for purpose. A verbal claim or undated image is weak. A documented supplier declaration is stronger but may remain unverified. Traceable records, reproducible analysis, independent validation and assurance increase confidence.","Quality dimensions include completeness, accuracy, timeliness, consistency, spatial resolution and lineage. The best dataset is not always the most detailed; it is the one capable of answering the decision question at an acceptable level of uncertainty.","Keep an evidence register linking each published statement to its source, owner, calculation, review and expiry date. When the underlying data change, the claim must be reviewed."]},{"kicker":"Chapter","title":"3. CHAPTER 5.2: Frameworks and materiality","paragraphs":[]},{"kicker":"5.2.1","title":"5.2.1: ESRS E4, TNFD and SBTN have different jobs","paragraphs":["ESRS E4 addresses biodiversity and ecosystems within European sustainability reporting where material and applicable. TNFD provides recommendations for disclosing nature-related dependencies, impacts, risks and opportunities, supported by the LEAP assessment approach. SBTN develops methods for companies to assess pressures, prioritise and set science-based targets for nature.","These tools can inform one another, but they are not interchangeable. A TNFD-aligned risk assessment is not automatically a validated science-based target. A target is not proof of achievement. A disclosure requirement is not a method for measuring every ecological outcome.","Regulatory requirements and framework versions evolve. Controlled corporate guidance and current source documents take precedence over examples in this course."]},{"kicker":"5.2.2","title":"5.2.2: Double materiality without double counting","paragraphs":["Impact materiality asks how the organisation affects people and the environment. Financial materiality asks how sustainability matters create or may create financial effects. One biodiversity issue may be material under both lenses, but the assessment should show the causal pathways rather than count the same evidence twice.","A wetland impact may be material because of ecological significance and affected stakeholders. The same site relationship may create permitting delay, flood exposure or remediation cost. Those are connected perspectives, not one interchangeable score.","Materiality is not permission to ignore all non-material topics operationally. Legal duties, permit conditions and local controls still apply. Materiality determines reporting focus; it does not replace compliance or management."],"figureSrc":"images/m5/m5-hero.jpg","figureLabel":"Review and assurance"},{"kicker":"Chapter","title":"4. CHAPTER 5.3: Recognising greenwashing patterns","paragraphs":[]},{"kicker":"5.3.1","title":"5.3.1: Common claim failures","paragraphs":["Vague claims use terms such as “eco-friendly”, “natural” or “impact-free” without a defined attribute. Absolute claims hide residual impact. Cherry-picking highlights a small initiative while omitting the relevant footprint. False equivalence treats planting, avoided emissions and habitat condition as interchangeable.","Boundary omission reports one site or product as though it represented the whole organisation. Baseline manipulation selects a convenient year. Causal overreach credits the company for a trend that may have other drivers. Future-washing promotes an aspiration as if delivery were already secured.","The remedy is specific language: identify the action, subject, boundary, baseline, period, metric, result, method and limitation. If independent assurance applies, state its scope accurately."],"figureSrc":"images/m5/m5-caso.jpg","figureLabel":"Claim review under scrutiny"},{"kicker":"5.3.2","title":"5.3.2: A seven-question claim test","paragraphs":["Before publication, ask: What exactly changed? Compared with which baseline? Within what boundary and period? Which metric and method were used? Who owns and reviewed the data? What uncertainty or residual impact remains? Would a reasonable reader infer more than the evidence proves?","The last question is crucial. A technically true sentence can still mislead through imagery, placement or omitted context. Review the complete communication, not only the numeric footnote.","If the evidence is not ready, change the message or delay the claim. Communication deadlines do not improve data quality."]},{"kicker":"6","title":"6. Module summary","paragraphs":["Credible sustainability communication begins inside the management system. Metrics, controls, review and assurance come first; the public claim is the final, narrow expression of that evidence."]}],"practical":{"title":"Decision case: audit a nature-related claim","intro":"Fictional draft: “Our site is now nature positive because employees planted 500 native trees this year.” The team has invoices and photographs, but no survival survey, habitat baseline, land-management plan or assessment of the site’s other pressures.","steps":["Identify the unsupported outcome claim and missing boundary.","Separate the verified activity from the unmeasured ecological result.","Specify the evidence needed: baseline, survival and condition indicators, maintenance period, pressures and responsible owner.","Rewrite the statement so it reports only what is currently supported."],"options":["Publish the draft because the exact number of trees is documented.","Change “nature positive” to “green” and keep the rest.","Report the verified planting activity and species-selection basis, state that ecological outcomes are not yet established, and commit to a defined monitoring plan only if it has been approved."],"correct":2,"feedbackCorrect":"Correct. The rewrite preserves the verified fact, avoids an unsupported outcome and explains what evidence is still needed.","feedbackIncorrect":"Not yet. A precise activity count does not prove a net-positive ecological outcome, and replacing one vague term with another does not solve the evidence gap.","takeaway":"A defensible statement is narrower than the work behind it—and never broader than the evidence."},"evaluation":{"title":"Knowledge check","question":"Which statement is the most credible?","options":["The project is impact-free because its operational emissions fell.","Within the defined project boundary, pressure indicator X decreased by 18% from the 2024 baseline; the method, exclusions and residual impacts are disclosed.","The programme protects biodiversity because it follows a recognised framework."],"correct":1,"feedbackCorrect":"Correct. The statement defines boundary, metric, baseline and limitation without claiming more than the evidence supports.","feedbackIncorrect":"Review the evidence architecture. Emissions, framework alignment and good intentions do not by themselves prove a biodiversity outcome."},"closing":"Transparency is not weakness. Showing boundaries, uncertainty and residual impact gives decision-makers the information they need and protects trust.","sources":[{"label":"European Commission — corporate sustainability reporting","url":"https://finance.ec.europa.eu/financial-markets/company-reporting-and-auditing/company-reporting/corporate-sustainability-reporting_en"},{"label":"EFRAG — ESRS E4 Biodiversity and Ecosystems","url":"https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-e4-biodiversity-and-ecosystems/"},{"label":"TNFD — disclosure recommendations","url":"https://tnfd.global/recommendations/"},{"label":"Science Based Targets Network — methods and action framework","url":"https://sciencebasedtargetsnetwork.org/companies/take-action/"}]},{"id":"m6","index":"06","title":"A400M and Eurofighter Nature Decision Lab","objective":"Integrate the course into a fictional programme decision: define the system, locate pressures and dependencies, compare alternatives, manage uncertainty and write a claim that survives technical review.","duration":"105–125 min","tag":"Capstone","theme":{"ink":"#15202b","panel":"#f3f6f4","soft":"#dfe9e3","line":"#5d846f","accent":"#355f49"},"hero":"images/m2/m2-hero.jpg","support":"images/m3/m3-caso.jpg","case":"images/m1/m1-caso.jpg","openingTitle":"1. The scenario is fictional; the reasoning is transferable","openingParagraphs":["This laboratory does not use confidential programme data and does not represent an official Airbus decision. It combines fictional information about an A400M maintenance-support area and a Eurofighter component supply change so learners can practise the method safely.","The task is not to find a perfect “green” option. It is to make a traceable decision under constraints: safety and airworthiness remain non-negotiable, ecological evidence is incomplete, impacts occur at different locations and times, and some controls require collaboration across engineering, procurement, facilities and environmental specialists."],"sections":[{"kicker":"Chapter","title":"2. CHAPTER 6.1: Frame the decision before comparing options","paragraphs":[]},{"kicker":"6.1.1","title":"6.1.1: Define need, boundary and decision owner","paragraphs":["State the operational need in functional terms. “Build a new area” is a proposed solution; “provide safe capacity for defined maintenance tasks by a given date” is the need. Keeping the need separate allows teams to test scheduling, layout, existing capacity and off-site alternatives.","Set the boundary across relevant life-cycle stages and locations. The support-area decision includes land, drainage, lighting, traffic and maintenance. The component decision includes material source, processing, logistics, performance, qualification and end of life.","Name the accountable decision owner and technical reviewers. Biodiversity evidence informs the decision, but no single environmental indicator overrides airworthiness, security or safety. The record must show how constraints and residual risks were integrated."]},{"kicker":"6.1.2","title":"6.1.2: Build the dependency and impact register","paragraphs":["For each option, map dependencies such as water availability, flood regulation, stable soils, biological raw materials and supplier ecosystem services. Then map pressures such as land occupation, water withdrawal, pollution, noise, light, transport and upstream conversion.","Do not label every relationship material. Score the plausibility and severity of the pathway, location sensitivity, reversibility, evidence confidence and control strength. Separate known facts from assumptions.","A useful register includes: activity, location, receptor, pressure or dependency, evidence, uncertainty, existing control, additional action, owner and decision date. The register is a living control document, not a one-off workshop output."],"figureSrc":"images/m3/m3-caso.jpg","figureLabel":"Operational footprint and ecological setting"},{"kicker":"Chapter","title":"3. CHAPTER 6.2: Compare alternatives without false precision","paragraphs":[]},{"kicker":"6.2.1","title":"6.2.1: Multi-criteria analysis and non-negotiable gates","paragraphs":["Some criteria are gates: legal compliance, airworthiness, safety and protected-species constraints cannot be traded for points elsewhere. Other criteria can be compared, such as disturbed land, water demand, cost, schedule, supplier evidence and reversibility.","Weights should be agreed before scoring where possible. If the preferred option changes dramatically with small weight changes, the decision is sensitive and should not be presented as obvious. Show the range, not only the winning total.","A high score cannot compensate for missing critical evidence. Use confidence ratings and conditional approvals: an option may proceed only after a seasonal survey, drainage test, supplier audit or qualification result."]},{"kicker":"6.2.2","title":"6.2.2: Uncertainty, reversibility and adaptive controls","paragraphs":["Uncertainty is not a reason to stop every decision. It changes the control strategy. Where potential harm is serious or irreversible, preserve avoidance options and gather stronger evidence. Where effects are limited and reversible, a monitored pilot may be proportionate.","Adaptive management defines triggers in advance. For example: if monitored water level falls below a threshold, suspend the activity and investigate; if supplier traceability is not verified by the gate date, freeze expansion of the source; if habitat condition fails to improve, revise the restoration method.","A trigger needs a metric, frequency, owner, action and authority. “Monitor closely” is not an operational control."],"figureSrc":"images/m1/m1-apoyo.jpg","figureLabel":"Baseline, threshold and adaptive response"},{"kicker":"Chapter","title":"4. CHAPTER 6.3: Decision record and communication","paragraphs":[]},{"kicker":"6.3.1","title":"6.3.1: What a reviewable decision pack contains","paragraphs":["The pack should contain the functional need, alternatives considered, non-negotiable constraints, spatial boundary, baseline, pressure and dependency register, evidence sources, uncertainty, mitigation sequence, selected controls, owners, cost and schedule implications, monitoring triggers and residual impact.","Include rejected options and reasons. This demonstrates that avoidance was genuinely tested and allows later reviewers to understand trade-offs. Link each material statement to its evidence rather than copying conclusions between slides.","Schedule a post-decision review. New survey data, supplier information or operating experience may change the assessment."]},{"kicker":"6.3.2","title":"6.3.2: From technical record to credible claim","paragraphs":["The external or internal message must be narrower than the decision pack. It can accurately describe an implemented control or measured result within a defined boundary. It should not translate a preferred option into “nature positive” or imply that one project represents the complete programme footprint.","A suitable structure is: action + subject + boundary + baseline + measured result + method + limitation. Example: “Within the fictional training-site boundary, the selected layout avoids direct conversion of the mapped seasonal-pond buffer; residual drainage and disturbance risks remain subject to the specified monitoring triggers.”","Notice what the sentence does not claim: it does not prove a net biodiversity gain, remove upstream impacts or describe official Airbus performance."]},{"kicker":"5","title":"5. Capstone summary","paragraphs":["A strong biodiversity decision is not the option with the most environmental language. It is the option whose need, evidence, alternatives, mitigation sequence, ownership, uncertainty and residual impact can be reconstructed by an independent reviewer."]}],"practical":{"title":"Capstone decision","intro":"Fictional combined case: Option A expands the A400M support area onto connected semi-natural grassland and offers the shortest schedule. Option B reconfigures existing sealed land, adds internal logistics time and requires a lighting redesign. Option C uses lower-condition land but changes drainage near a seasonal pond. In parallel, a Eurofighter component supplier proposes a lower-mass material with incomplete origin data; qualification testing is not finished.","steps":["Keep the facility and component decisions separate enough to avoid false compensation.","Apply safety and airworthiness gates first.","Test avoidance, request location-specific evidence and rate uncertainty.","Define conditional approvals, monitoring triggers and owners.","Write a decision statement that does not claim a net outcome."],"options":["Select A and offset the grassland loss with the lower-mass component.","Select B immediately because previously sealed land is always impact-free.","Prioritise B for detailed design because it avoids direct habitat conversion, verify lighting and logistics controls, keep C as a conditional alternative, and assess the component only after origin and qualification evidence are sufficient."],"correct":2,"feedbackCorrect":"Correct. The decision respects non-negotiable gates, avoids false compensation, prioritises avoidance and keeps conditions and uncertainty visible.","feedbackIncorrect":"Not yet. Environmental benefits in different places cannot be traded casually, and previously sealed land can still create drainage, lighting or operational impacts.","takeaway":"Integration means comparing trade-offs transparently—not collapsing them into one convenient score."},"evaluation":{"title":"Final knowledge check","question":"What makes a biodiversity decision technically defensible?","options":["A recognised label and a high combined sustainability score.","A traceable chain from need and location-specific evidence through alternatives, mitigation, ownership, uncertainty and residual impact.","A restoration promise made before avoidance alternatives are tested."],"correct":1,"feedbackCorrect":"Correct. Defensibility comes from a reviewable decision process and evidence chain.","feedbackIncorrect":"Return to the decision-pack section. Labels and restoration do not replace location-specific evidence or avoidance."},"closing":"You have completed the full decision cycle: understand the system, locate the interface with nature, evaluate evidence, compare controls, assign ownership and communicate no more than the evidence proves.","sources":[{"label":"TNFD — LEAP assessment approach","url":"https://tnfd.global/publication/additional-guidance-on-assessment-of-nature-related-issues-the-leap-approach/"},{"label":"Science Based Targets Network — AR3T action framework","url":"https://sciencebasedtargetsnetwork.org/companies/take-action/act/"},{"label":"Airbus — Earth observation capabilities","url":"https://www.airbus.com/en/products-services/space/earth-observation"},{"label":"EFRAG — ESRS E4 Biodiversity and Ecosystems","url":"https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-e4-biodiversity-and-ecosystems/"}]}]};
const icons = {"m1":"🌍","m2":"🛰️","m3":"🔗","m4":"🤝","m5":"📊","m6":"🧭"};
const savedProgress=(()=>{try{return JSON.parse(localStorage.getItem('airbusNatureCourseProgress')||'{}')}catch{return {}}})();
const state={view:'home',currentModule:null,answers:{},completed:savedProgress};
const qs = sel => document.querySelector(sel);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function parseSectionHeading(rawTitle,kicker){
  const colonIndex = rawTitle.indexOf(':');
  const prefix = colonIndex >= 0 ? rawTitle.slice(0, colonIndex).trim() : '';
  const rest = colonIndex >= 0 ? rawTitle.slice(colonIndex + 1).trim() : rawTitle;
  let cleanPrefix = prefix;
  const dotSpaceIndex = cleanPrefix.indexOf('. ');
  if(dotSpaceIndex>0){
    const maybeNumber = cleanPrefix.slice(0,dotSpaceIndex);
    const isOnlyDigits = [...maybeNumber].every(ch=>ch>='0'&&ch<='9');
    if(isOnlyDigits) cleanPrefix = cleanPrefix.slice(dotSpaceIndex+2);
  }
  if(cleanPrefix.toUpperCase().startsWith('CHAPTER ')) return {eyebrow:cleanPrefix.toUpperCase(), title:rest, isChapter:true};
  const isNumbered = prefix.length>0 && [...prefix].every(ch=>(ch>='0'&&ch<='9')||ch==='.');
  if(isNumbered) return {eyebrow:prefix,title:rest,isChapter:false};
  return {eyebrow:String(kicker||'').toUpperCase(), title:rawTitle, isChapter:String(kicker||'').toUpperCase()==='CHAPTER'};
}
function splitLeadText(text){const i=text.indexOf(':'); return i>0 && i<95 ? {lead:text.slice(0,i+1),rest:text.slice(i+1).trim()} : {lead:'',rest:text};}
function figureHtml(src,label,tone,tall=false){
  const cls = tall ? 'media' : 'media short';
  return `<div class="${cls}" style="border-color:${tone.line};background:${tone.soft}"><img src="${esc(src)}" alt="${esc(label)}" onerror="this.parentElement.innerHTML=window.figureFallback('${esc(label)}','${esc(tone.line)}','${esc(tone.soft)}','${esc(tone.panel)}')"><div class="label">${esc(label)}</div></div>`;
}
window.figureFallback=(label,line,soft,panel)=>`<div class="media short" style="border-color:${line};background:linear-gradient(135deg,${soft} 0%, #fff 55%, ${panel} 100%)"><div class="fallback"><div class="fallback-inner"><div class="ficon"></div><div class="label">${label}</div></div></div></div>`;
function renderParagraph(paragraph,accent){
  const trimmed = String(paragraph||'').trim(); if(!trimmed) return '';
  if(trimmed.startsWith('* ')){
    const parts=splitLeadText(trimmed.slice(2).trim());
    return `<div class="highlight"><div class="leadrow"><div class="dot" style="background:${accent}"></div><p>${parts.lead?`<strong>${esc(parts.lead)}</strong> `:''}${esc(parts.rest)}</p></div></div>`;
  }
  const isLetteredHeading = /^[A-Z]\.\s/.test(trimmed);
  if(isLetteredHeading) return `<div class="box-title">${esc(trimmed)}</div>`;
  const dotSpaceIndex = trimmed.indexOf('. ');
  if(dotSpaceIndex>0){
    const maybeNumber = trimmed.slice(0,dotSpaceIndex);
    const isOnlyDigits = [...maybeNumber].every(ch=>ch>='0'&&ch<='9');
    if(isOnlyDigits){
      const parts=splitLeadText(trimmed.slice(dotSpaceIndex+2));
      return `<div class="numbox"><div class="numrow"><div class="numbadge" style="background:${accent}18;color:${accent}">${esc(maybeNumber)}</div><p>${parts.lead?`<strong>${esc(parts.lead)}</strong> `:''}${esc(parts.rest)}</p></div></div>`;
    }
  }
  if(trimmed.endsWith(':')) return `<div class="box-title">${esc(trimmed)}</div>`;
  const parts=splitLeadText(trimmed); const hasLead=!!parts.lead && parts.lead.length<80;
