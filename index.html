    .numrow{display:flex;gap:16px;align-items:flex-start}
    .numbadge{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:0 0 auto}

    @media (max-width: 1100px){.grid-home,.module-layout{grid-template-columns:1fr} .hero-grid,.program-grid,.article-grid{grid-template-columns:1fr} .program-body{border-left:0;border-top:1px solid rgba(0,0,0,.06)} .article-side{min-height:100px} .hero h1{font-size:58px} .program-header h1{font-size:48px} .section-preview{grid-template-columns:1fr} .sticky{position:static} }
    @media (max-width: 700px){.hero-grid{padding:24px} .hero h1{font-size:42px} .program-body h3{font-size:34px} .program-header h1{font-size:38px} .shell{padding:0 12px} .page{padding:20px 0 28px}}

<script>
const DATA = {"course": {"title": "Real Biodiversity and Sustainability at Airbus", "subtitle": "Digital course · Airbus", "intro": "A training journey on aviation, climate, biodiversity, geointelligence, food systems, internal collaboration and greenwashing prevention. The course combines theory, practical application and short evaluation so participants build a solid and usable understanding.", "structure": ["Theory developed through thematic blocks.", "A case study or practical dynamic in each module.", "Short self-assessment with technical feedback.", "A closing section focused on judgement and real-world application."]}, "modules": [{"id": "m1", "index": "01", "title": "The Intersection of Aviation, Climate and Nature", "objective": "Understand why protecting nature is no longer a peripheral gesture and has become a condition for operational resilience, supply-chain traceability and industrial survival.", "duration": "120–140 min", "tag": "Systemic risk", "theme": {"ink": "#15202b", "panel": "#fbf7f0", "soft": "#efe5d8", "line": "#c99a5b", "accent": "#30495c"}, "hero": "images/m1/m1-hero.jpg", "support": "images/m1/m1-apoyo.jpg", "case": "images/m1/m1-caso.jpg", "openingTitle": "1. Introduction: The paradigm shift from “carbon” to “nature”", "openingParagraphs": ["Historically, sustainability in aerospace has been framed as an engineering challenge focused on a single factor: carbon (CO2). The objective was clear: burn less fuel in order to emit fewer greenhouse gases. Yet this carbon-centric approach is incomplete.", "Airbus is moving toward a new paradigm of systemic sustainability. We recognise that climate is only one part of a much larger system called the biosphere. Biodiversity — the variety of life on Earth and the way it interacts — is the operating system of the planet. Without healthy biodiversity, the natural mechanisms that regulate climate begin to fail, which weakens any technological pathway to Net Zero. In this module we will see that protecting nature is not philanthropy; it is a core strategy for Airbus operational resilience."], "sections": [{"kicker": "Chapter", "title": "2. CHAPTER 1.1: The scientific framework: how does the Earth system work?", "paragraphs": []}, {"kicker": "1.1.1", "title": "1.1.1: Ecosystem services: Airbus’s invisible infrastructure", "paragraphs": ["For an aviation professional, infrastructure means runways, hangars and satellites. For the planet, infrastructure means ecosystem services: the benefits nature provides free of charge and without which Airbus could not operate.", "1. Regulating services: forests and oceans absorb around 50% of our CO2 emissions. They are natural carbon sinks. If the biodiversity of those systems degrades because of fires, pests or deforestation, more CO2 remains in the atmosphere, warming accelerates and flight conditions become more dangerous and more expensive.", "2. Provisioning services: nature supplies physical materials. That includes freshwater for surface treatment in our plants and, critically, biological materials such as natural rubber.", "3. Supporting services: processes such as nutrient cycling and soil formation that sustain the economic stability of the regions where Airbus operates and where its customers are based."], "figureSrc": "images/m1/m1-apoyo.jpg", "figureLabel": "Invisible infrastructure"}, {"kicker": "1.1.2", "title": "1.1.2: The 9 planetary boundaries: the global flight envelope", "paragraphs": ["To understand the urgency inside Airbus, we need the concept of Planetary Boundaries. This framework was created in 2009 by the Stockholm Resilience Centre to define the thresholds humanity should not cross if it wants to maintain Earth system stability.", "Imagine that Earth has a flight envelope. When an aircraft leaves it, it enters stall conditions or structural risk. Scientists have identified nine boundaries that act like our flight indicators:", "1. Climate change: measures atmospheric CO2 concentration. (Exceeded).", "2. Biosphere integrity (biodiversity): measures species extinction. It is the most critical boundary. (Severely exceeded).", "3. Land-system change: conversion of forests into farms. (Exceeded).", "4. Freshwater use: alteration of rivers and aquifers. (Exceeded).", "5. Biogeochemical flows: excess nitrogen and phosphorus in water. (Exceeded).", "6. Novel entities: pollution from plastics, chemicals and synthetic materials. (Exceeded).", "7. Ocean acidification: the sea becomes more acidic as it absorbs CO2, killing coral systems.", "8. Stratospheric ozone depletion: the only boundary showing recovery.", "9. Atmospheric aerosol loading: dust and smoke particles that alter climate behaviour.", "Why does this matter for Airbus? Because six of the nine boundaries have already been crossed. In practice, we are operating in turbulent air. Crossing those limits creates climate and resource unpredictability that undermines financial and logistics planning for any industrial company."], "figureSrc": "images/m1/m1-apoyo.jpg", "figureLabel": "Planetary boundaries"}, {"kicker": "1.1.3", "title": "1.1.3: The life-cycle challenge and Scope 3", "paragraphs": ["Life Cycle Assessment (LCA) aims to measure the impact of an Airbus A350 from the moment the mineral is still in the mine to the point when the aircraft is dismantled.", "* The Scope 3 challenge: this is where our greatest difficulty lies. Scope 3 covers the impacts of our supply chain and the impacts created when airlines use our products.", "* The audit reality: Airbus works with thousands of suppliers. Obtaining real data from a bauxite mine in Guinea or a component manufacturer in Asia is extremely difficult. Today we still rely on estimates because many suppliers do not yet have robust reporting capacity. That is a critical issue in external audits: limited visibility over Tier 2 and Tier 3 impacts creates legal risk that Airbus must address through stronger collaboration and more demanding technical clauses in procurement contracts."]}, {"kicker": "Chapter", "title": "3. CHAPTER 1.2: Strategic risks and critical dependencies", "paragraphs": []}, {"kicker": "1.2.1", "title": "1.2.1: The natural rubber case: a high-risk biological dependency", "paragraphs": ["Many employees ask: “Why does a company that builds carbon-fibre aircraft depend on a tree?” The answer lies in the extreme physics of landing.", "Why is it irreplaceable? An aircraft such as the A380 touches down at around 250 km/h while weighing hundreds of tonnes. In that single second, tyres suffer brutal deformation and enormous heat build-up.", "* Synthetic rubber, derived from oil, is excellent for cars, but in aircraft it overheats and breaks down.", "* Only natural polyisoprene from Hevea brasiliensis has strain-induced crystallisation: it becomes stronger when stretched and dissipates heat in a unique way. Without natural rubber, tyres would fail on landing.", "* The systemic risk (SALB fungus): about 90% of the world’s rubber comes from Southeast Asia, yet the trees are essentially clones. A single spore of Microcyclus ulei, the South American leaf blight fungus, could spread to Asia and destroy the continent’s rubber trees within months.", "* Real precedent: this fungus already destroyed Ford’s plantations in Brazil in the 1930s.", "* Impact on Airbus: if rubber supply fails, aircraft deliveries stop. The airplanes may be complete on the apron, but without certified tyres they cannot fly. It is a stop-point risk for the whole industry."], "figureSrc": "images/m1/m1-caso.jpg", "figureLabel": "Critical rubber dependency"}, {"kicker": "1.2.2", "title": "1.2.2: The new legal framework: CSRD and TNFD", "paragraphs": ["If you have never heard these acronyms, it is because they are new — but they are going to change the way we work. They are laws and frameworks that require Airbus to tell the truth about its impact on nature.", "1. CSRD (Corporate Sustainability Reporting Directive): a mandatory European law. It requires Airbus to publish sustainability reports audited with the same seriousness as financial accounts. It introduces double materiality:", "* Impact materiality: what Airbus does to nature.", "* Financial materiality: what nature can do to Airbus, for example if a flood shuts down a factory.", "2. TNFD (Taskforce on Nature-related Financial Disclosures): a global framework used by investors and banks to judge whether Airbus is a safe company to finance. If we cannot demonstrate that biodiversity risks are being managed, funding new aircraft programmes becomes much more expensive — or unavailable."]}, {"kicker": "1.2.3", "title": "1.2.3: Governance: risks and opportunities", "paragraphs": ["Risks of poor management:", "* Transition risk: laws may change faster than we can adapt our factories, exposing us to major penalties.", "* Reputational risk: losing the trust of customers and, above all, employees. Pride of belonging falls if the company is seen as a destroyer of nature.", "Strategic opportunities:", "* Talent attraction: many young engineers choose companies with a real sustainability strategy. In a highly competitive talent market, leadership in biosphere protection becomes a recruitment advantage.", "* Innovation and eco-design: understanding nature leads us toward biomimicry — learning from natural forms to design more efficient wings — and additive manufacturing that reduces waste of scarce, high-value materials."]}, {"kicker": "Summary", "title": "4. Module summary and conclusion", "paragraphs": ["This module shows that Airbus is not only a company of machines; it is a company that depends on biological systems. Understanding planetary boundaries, managing the natural-rubber dependency and complying with CSRD are not extra tasks. They are part of the foundation for our survival as an aerospace leader. Biodiversity is the insurance policy of our supply chain."]}]}, {"id": "m2", "index": "02", "title": "Geointelligence: Airbus space technology as a protector of the biosphere", "objective": "In this module we explore how our satellites have become some of the most powerful biosensors on the planet.", "duration": "110–130 min", "tag": "Technological capability", "theme": {"ink": "#141c28", "panel": "#f7f4ee", "soft": "#dfeaf1", "line": "#6d90aa", "accent": "#1f3f5b"}, "hero": "images/m2/m2-hero.jpg", "support": "images/m2/m2-apoyo.jpg", "case": "images/m2/m2-caso.jpg", "openingTitle": "1. Introduction: From strategic surveillance to planetary protection", "openingParagraphs": ["Historically, Earth observation from space was born for military and state-intelligence purposes. In the context of today’s ecological crisis, however, Airbus Defence and Space has redirected that technological capability toward the defining challenge of our era: the lack of objective data about the state of nature.", "Geointelligence is not just about taking pictures from space. It is the ability to process, analyse and validate geospatial information so that critical decisions can be made with confidence. For Airbus, that means providing governments and corporations with a single source of truth to combat greenwashing, stop deforestation and protect ecosystem integrity. In this module we will see how our satellites have become some of the most powerful biosensors on Earth."], "sections": [{"kicker": "Chapter", "title": "2. CHAPTER 2.1: The eyes of Earth: next-generation sensors", "paragraphs": []}, {"kicker": "2.1.1", "title": "2.1.1: Ultra-high-resolution optics (the detail that saves species)", "paragraphs": ["To manage biodiversity effectively, image resolution is the line between an assumption and legally useful evidence. In the past, low-resolution satellites could only distinguish “green patches” from “brown patches”. Airbus broke that barrier.", "The Pléiades Neo constellation: the new 30 cm standard.", "Airbus operates the most advanced constellation in its class: Pléiades Neo. Made up of four identical satellites, the system delivers a native 30-centimetre resolution. While public satellites such as Sentinel-2 view the world in 10-metre pixels, Pléiades Neo can detect objects about the size of a dinner plate from space.", "* Species identification and forest inventory: at 30 cm resolution, geointelligence can support forest inventories without sending human teams into dangerous or inaccessible areas. Individual tree species can be inferred through canopy architecture and spectral signature analysis.", "* Canopy health assessment: using specific spectral bands such as Deep Blue and Red Edge, satellites can detect water stress or disease in trees before it is visible to the human eye, enabling action against pests that could devastate entire habitats.", "* Real example: Airbus works with the NGO Madagasikara Voakajy in Madagascar. High-resolution imagery is used to monitor remaining forest fragments and help protect habitat for critically endangered species such as lemurs. The ability to detect trails barely one metre wide makes human intrusion into protected sanctuaries visible."], "figureSrc": "images/m2/m2-apoyo.jpg", "figureLabel": "Ultra-high-resolution optics"}, {"kicker": "2.1.2", "title": "2.1.2: Preventing degradation: stopping “invisible deforestation”", "paragraphs": ["It is essential not to confuse deforestation with forest degradation. Deforestation is total removal of a forest. Forest degradation, by contrast, is the selective removal of the most valuable trees while much of the canopy remains visually intact.", "* Detecting selective logging: from low-resolution satellites a degraded forest can still look “green”. Pléiades Neo, however, detects the light gaps left when a single giant tree is removed and the narrow log landings or extraction tracks that are often less than three metres wide.", "* Preventive legal intervention: detecting selective extraction allows authorities to intervene while damage is still reversible. Airbus can provide the imagery as auditable evidence in legal action against illegal logging.", "* Use case: the Starling service, developed by Airbus with Earthworm Foundation, is used by multinational companies such as Nestlé and Ferrero to demonstrate that suppliers have not degraded protected areas. The system creates automated alerts based on comparisons of ultra-high-resolution imagery, reducing documentary fraud."], "figureSrc": "images/m2/m2-caso.jpg", "figureLabel": "Invisible deforestation"}, {"kicker": "2.1.3", "title": "2.1.3: Radar vision (SAR): the shield against environmental “blindness”", "paragraphs": ["The most biodiverse regions on Earth, including the Congo Basin and the Amazon, are covered by clouds for more than 250 days a year. This is where Airbus synthetic aperture radar becomes indispensable.", "* What is SAR radar? It is an active sensor that emits its own microwave pulses and measures the return signal. It can see through dense clouds, smoke, volcanic ash and total darkness.", "* TerraSAR-X and TanDEM-X: these twin satellites fly in precise formation using interferometry to create 3D terrain models such as WorldDEM with near-millimetric accuracy.", "* Biomass measurement: radar penetrates foliage to some extent and helps estimate trunk volume. That allows forests to be “weighed” and the carbon they store to be quantified, which is essential for international climate agreements.", "* Reference: Airbus is the prime contractor for ESA’s Biomass mission, designed to build a global 3D inventory of forest carbon."], "figureSrc": "images/m2/m2-hero.jpg", "figureLabel": "SAR radar vision"}, {"kicker": "Chapter", "title": "3. CHAPTER 2.2: Global partnerships and the Copernicus programme", "paragraphs": ["Airbus is a key industrial pillar of Copernicus, the EU and ESA Earth-observation programme."]}, {"kicker": "2.2.1", "title": "2.2.1: CAMS and C3S: atmosphere and climate monitoring", "paragraphs": ["* CAMS (atmosphere monitoring): Airbus builds instruments for Sentinel-4 and Sentinel-5 missions, tracking pollutants and forest fires. In 2023 those systems helped track smoke from the Canadian fires as it crossed the Atlantic.", "* C3S (climate change): the service provides data on sea-level rise through Sentinel-6 and on soil moisture. Airbus Protect uses these datasets to assess infrastructure risk at airports and to support the design of nature-based flood defences."], "figureSrc": "images/m2/m2-apoyo.jpg", "figureLabel": "Atmospheric and climate monitoring"}, {"kicker": "2.2.2", "title": "2.2.2: Collaboration with IUCN: verifying restoration", "paragraphs": ["Airbus provides independent MRV — monitoring, reporting and verification — for reforestation projects.", "* Seedling survival: with 30 cm imagery, it becomes possible to verify individually whether planted trees survive during the first 24 months.", "* Real example: Atlantic Forest restoration in Brazil, reconnecting forest fragments in order to secure the genetic diversity of fauna."], "figureSrc": "images/m2/m2-caso.jpg", "figureLabel": "Restoration verification"}, {"kicker": "Chapter", "title": "4. CHAPTER 2.3: Application cases and real-world impact", "paragraphs": []}, {"kicker": "2.3.1", "title": "2.3.1: Monitoring “dark vessels” (ocean protection)", "paragraphs": ["Illegal vessels switch off their identification system (AIS) in order to plunder marine sanctuaries.", "* The Airbus solution: we cross-check the physical echo detected by radar, such as TerraSAR-X, against AIS signals. If radar sees a ship where there is no AIS signal, it is a dark vessel. We can then task an optical satellite to identify hull markings and gear in collaboration with Global Fishing Watch."], "figureSrc": "images/m2/m2-hero.jpg", "figureLabel": "Ocean protection"}, {"kicker": "2.3.2", "title": "2.3.2: “Satellites for Biodiversity” awards", "paragraphs": ["We support scientists using space data to monitor chimpanzee habitats and protect the Andean bear in extreme field conditions."]}, {"kicker": "Chapter", "title": "5. CHAPTER 2.4: The future: NEXT SPACE and planetary protection", "paragraphs": []}, {"kicker": "2.4.1", "title": "2.4.1: Space sustainability and orbital debris", "paragraphs": ["We design satellites under space eco-design principles so they disintegrate safely at end of life, and we participate in orbital clean-up initiatives such as CleanSpace."]}, {"kicker": "2.4.2", "title": "2.4.2: Committee on Planetary Protection (CoPP)", "paragraphs": ["We follow COSPAR protocols to prevent biological contamination:", "1. Forward contamination: avoiding the transfer of terrestrial microbes to other worlds, for example on the JUICE mission to Jupiter.", "2. Backward contamination: sealing samples returned from other planets in order to protect Earth’s biosphere, as in Mars Sample Return concepts."]}, {"kicker": "Sources", "title": "Source list and references: Airbus module 2", "paragraphs": []}, {"kicker": "1", "title": "1. Primary Airbus documentation", "paragraphs": ["* Airbus Defence and Space (2024): Geointelligence: Space Technology as a Protector of the Biosphere. Technical report on the use of satellite constellations for environmental monitoring.", "* Airbus Intelligence (2024): Pléiades Neo: Technical Specifications and User Guide. Details on 30 cm resolution and spectral bands.", "* Airbus Protect (2024): Climate Risk Assessment for Infrastructure. Methodologies for using climate data to improve asset resilience.", "* Airbus internal document: Next Space Initiative: Sustainable Exploration and Planetary Protection.", "* Airbus Committee on Planetary Protection (CoPP): Procedures and COSPAR compliance manual."]}, {"kicker": "2", "title": "2. International programmes and institutions", "paragraphs": ["* Copernicus Programme (ESA / European Commission).", "* CAMS (Copernicus Atmosphere Monitoring Service): data on aerosols, wildfires and air quality.", "* C3S (Copernicus Climate Change Service): essential climate variables and forecasting models.", "* ESA: Biomass mission (P-band SAR) and Sentinel-6 sea-level documentation.", "* IUCN: Restoration Barometer methodology for land-restoration commitments.", "* ECMWF: support data for Copernicus services."]}, {"kicker": "3", "title": "3. Scientific and regulatory frameworks", "paragraphs": ["* COSPAR (Committee on Space Research): Policy on Planetary Protection.", "* Stockholm Resilience Centre: Planetary Boundaries framework.", "* ISO 14040 / 14044: international standards for Life Cycle Assessment applied to satellites and aircraft.", "* MDPI Encyclopedia: Life Cycle Assessment in Aviation."]}, {"kicker": "4", "title": "4. Use cases and technical applications", "paragraphs": ["* Earthworm Foundation: Starling methodology for monitoring deforestation in raw-material supply chains.", "* Global Fishing Watch: dark-vessel detection through AIS and SAR cross-analysis.", "* Madagasikara Voakajy: Pléiades-based habitat protection for lemurs in Madagascar.", "* Connected Conservation Foundation: reports from Satellites for Biodiversity award winners."]}, {"kicker": "5", "title": "5. References for specific missions", "paragraphs": ["* JUICE mission: cleaning and sterilisation protocols for icy-moon exploration.", "* TerraSAR-X & TanDEM-X: SAR interferometry fundamentals and WorldDEM generation.", "* Mars Sample Return concepts: Earth Return Orbiter design and sample-containment safety protocols."]}]}, {"id": "m3", "index": "03", "title": "Food systems and the biodiversity crisis: the land-use challenge", "objective": "This is not only a nutrition issue. It is one of the biggest resource-optimisation challenges humanity faces, especially in land and water use.", "duration": "110–130 min", "tag": "Spatial efficiency", "theme": {"ink": "#20180f", "panel": "#fcf7ef", "soft": "#f2dfc5", "line": "#bb7d31", "accent": "#6d4a1d"}, "hero": "images/m3/m3-hero.jpg", "support": "images/m3/m3-apoyo.jpg", "case": "images/m3/m3-caso.jpg", "openingTitle": "1. Introduction: Food as global resource management", "openingParagraphs": ["Technical discussions about the global ecological crisis often focus almost exclusively on direct carbon emissions from industry and transport. Yet the international scientific consensus is clear: the global food system is the main driver of biodiversity loss on the planet. This is not only about nutrition; it is about the largest challenge in optimising land and water use.", "For Airbus, understanding this system matters for three reasons:", "Supply-chain resilience: competition for land affects the availability of biomass and other resources needed by industry.", "Health and productivity: the well-being of our workforce depends on healthy and resilient food systems.", "Mitigation of physical risks: uncontrolled agricultural expansion destroys the ecosystems that serve as natural defences for our infrastructure."], "sections": [{"kicker": "Chapter", "title": "2. CHAPTER 3.1: The food system as a driver of global degradation", "paragraphs": []}, {"kicker": "3.1.1", "title": "3.1.1: Impacts on the biosphere and land use", "paragraphs": ["Agriculture is the largest human transformation of the Earth’s surface. Scientific evidence gathered by bodies such as IPBES confirms that the current food system is the biggest threat to biosphere integrity because of its massive land occupation.", "A. The extinction factor (86% of species).", "Expansion of the agricultural frontier is the number one cause of biodiversity loss. Agriculture is a direct threat to 86% of species currently at high risk of extinction.", "Impact mechanism: converting ecosystems into monocultures fragments habitats. Remaining patches of nature become isolated, limiting genetic flow and long-term survival.", "B. The land-system-change boundary.", "Agriculture uses around half of the planet’s habitable land. According to the Stockholm Resilience Centre framework, humanity has already exceeded the safe boundary for land conversion, entering a zone where Earth loses climate self-regulation capacity.", "C. Water stress and eutrophication.", "The food system is responsible for about 70% of global freshwater withdrawals. Excess fertiliser use drives eutrophication, creating low-oxygen “dead zones” in lakes and oceans. For Airbus this translates into water-scarcity risks in industrial regions such as India and southern Europe."], "figureSrc": "images/m3/m3-apoyo.jpg", "figureLabel": "Biosphere impacts and land use"}, {"kicker": "3.1.2", "title": "3.1.2: The “cheap food paradigm” and the loss of agrobiodiversity", "paragraphs": ["The current model prioritises immediate yield over resilience, creating a homogeneous and fragile system.", "Genetic erosion: around 75% of crop genetic diversity has been lost since 1900.", "The bottleneck: just nine crops account for about 66% of world production. Such homogenisation increases the risk of systemic collapse when pests or extreme climate events hit.", "Strategic connection: this is the same type of systemic risk discussed in Module 1 with natural rubber — dependence on a narrow biological base invites operational failure."], "figureSrc": "images/m3/m3-caso.jpg", "figureLabel": "Agrobiodiversity and resilience"}, {"kicker": "Chapter", "title": "3. CHAPTER 3.2: Spatial efficiency and the “land dividend”", "paragraphs": []}, {"kicker": "3.2.1", "title": "3.2.1: Land-occupation efficiency analysis", "paragraphs": ["From an asset-management and resource-optimisation perspective, the current food system contains a critical land-allocation failure. The issue is not only what we eat, but how much land we lock up to achieve a limited output.", "Trophic-pyramid inefficiency: in resource-engineering terms, each intermediate level in a supply chain consumes energy. In nature, roughly 90% of energy is lost when passing from plants to animals.", "Spatial footprint imbalance: today, around 77% of all agricultural land is dedicated to livestock, either as pasture or feed crops.", "Systemic opportunity cost: because of this inefficiency, most available land is committed to a model that supplies only a limited share of global demand. For a company like Airbus, this is a resource-allocation error: the land occupied is the same land the planet needs for its defensive infrastructure — forests, soils and carbon sinks.", "Pressure on the agricultural frontier: the high land demand required to feed animals is one of the forces pushing deforestation into primary forest. The result is very little room left for climate-restoration efforts."], "figureSrc": "images/m3/m3-hero.jpg", "figureLabel": "Land-occupation efficiency"}, {"kicker": "3.2.2", "title": "3.2.2: The plant-forward transition as an optimisation tool", "paragraphs": ["Plant-forward is treated here as a metric of spatial efficiency.", "Spatial impact: if the system moves toward more direct consumption of crops, global agricultural land use could fall dramatically — by around 75% in some analyses.", "The land dividend: the area that could be released — equivalent to the combined size of the United States, China, the EU and Australia — would make large-scale ecosystem restoration possible. That is the only “technology” capable of absorbing carbon at the scale needed for hard-to-abate sectors such as aviation to operate within a stable climate."], "figureSrc": "images/m3/m3-caso.jpg", "figureLabel": "Land dividend"}, {"kicker": "Chapter", "title": "4. CHAPTER 3.3: Strategic resilience and the value of natural capital", "paragraphs": ["Integrating biodiversity and land efficiency is not only an ethical issue; it is a long-term financial safeguard for Airbus operations."]}, {"kicker": "3.3.1", "title": "3.3.1: Mitigating physical risks in Airbus infrastructure", "paragraphs": ["Degradation of local ecosystems driven by uncontrolled agricultural expansion increases the vulnerability of our physical assets. Moving from grey infrastructure to nature-based solutions is therefore a major shift in civil-engineering logic.", "Flood protection: the sponge effect.", "Historical context: throughout the twentieth century, the standard industrial response to flooding was channelisation and concrete levees. Extreme events have shown, however, that these structures often fail by shifting the problem downstream.", "Scientific rationale: restoring wetlands and riparian forests around industrial sites provides a biological flood-buffering infrastructure. These ecosystems act as natural sponges: porous soils and root systems increase infiltration and slow surface runoff. A wetland can absorb millions of litres during a storm and release the water gradually, preventing drainage-system collapse.", "Practical Airbus application: at sites located near coasts or rivers, such as areas around the Garonne in Toulouse or the Elbe in Hamburg, maintaining natural floodplains protects hangars and final assembly lines directly. That reduces the risk of production stoppages and can lower climate-risk insurance costs.", "Thermal resilience: plant thermodynamics against the heat-island effect.", "Historical context: conventional industrial design prioritised paved surfaces and metallic buildings, creating urban and industrial heat islands that can raise local temperatures by several degrees above the rural surroundings.", "Scientific rationale: mature vegetation cools through two key processes — shading and evapotranspiration. Plants absorb solar energy to evaporate water, which actively cools surrounding air. Green surfaces also reflect and store heat differently than asphalt, reducing latent heat accumulation.", "Practical Airbus application: integrating green belts and vegetated roofs around logistics and industrial facilities can reduce building heat loads, lower HVAC energy costs, improve outdoor thermal comfort for employees and prolong the life of temperature-sensitive materials used in composite manufacturing."], "figureSrc": "images/m3/m3-apoyo.jpg", "figureLabel": "Mitigating physical risks"}, {"kicker": "Sources", "title": "5. Scientific sources and references", "paragraphs": []}, {"kicker": "5.1", "title": "5.1: Key reports and international organisations", "paragraphs": ["IPBES (2019): Global Assessment Report on Biodiversity and Ecosystem Services.", "UNEP, Chatham House & CIWF (2021): Food System Impacts on Biodiversity Loss.", "FAO (2019): The State of the World’s Biodiversity for Food and Agriculture.", "EAT-Lancet Commission (2019): Food in the Anthropocene."]}, {"kicker": "5.2", "title": "5.2: High-impact scientific literature", "paragraphs": ["Poore & Nemecek (2018): Reducing food’s environmental impacts through producers and consumers, Science.", "Steffen et al. (2015): Planetary boundaries: Guiding human development on a changing planet, Science.", "Newbold et al. (2015): Global effects of land use on local terrestrial biodiversity, Nature.", "Khoury et al. (2014): Increasing homogeneity in global food supplies and the implications for food security, PNAS."]}, {"kicker": "5.3", "title": "5.3: Management strategies and tools", "paragraphs": ["Project Drawdown (2020): Plant-Rich Diets.", "World Resources Institute (2019): Creating a Sustainable Food Future.", "TNFD (2023): Recommendations of the Taskforce on Nature-related Financial Disclosures."]}, {"kicker": "Summary", "title": "6. Module summary", "paragraphs": ["Food efficiency is one of the strongest levers for releasing the geographical space nature needs in order to protect us. Optimising land use means giving the planet enough room to act as the carbon sink and protective shield our industry and infrastructure need in order to operate safely."]}]}, {"id": "m4", "index": "04", "title": "Join the change! Community and collaborative action", "objective": "Inspire active participation across Airbus through collaboration, the exchange of practical tips and the connection of people who encourage positive habits in a friendly and social way.", "duration": "90–110 min", "tag": "Human network", "theme": {"ink": "#17221c", "panel": "#f7f5ee", "soft": "#dce8df", "line": "#6a9a7b", "accent": "#315645"}, "hero": "images/m4/m4-hero.jpg", "support": "images/m4/m4-apoyo.jpg", "case": "images/m4/m4-caso.jpg", "openingTitle": "Module objective", "openingParagraphs": ["Inspire active participation across Airbus through collaboration, the exchange of practical tips and the connection of people who encourage positive habits in a friendly and social way."], "sections": [{"kicker": "Chapter 4.1", "title": "The power of the network: committed people and local collaboration", "paragraphs": []}, {"kicker": "Subchapter 4.1.1", "title": "Together we go further", "paragraphs": ["At Airbus we are thousands of people, and one of our greatest strengths is our ability to collaborate. Moving toward a company that is more connected to nature does not have to feel boring or lonely.", "Across our plants and offices there are always colleagues committed to the environment: people who naturally come together to share ideas, solve doubts and launch small local initiatives. They do not need an official label to make a difference. What brings them together is the desire to improve the place where we work."], "figureSrc": "images/m4/m4-apoyo.jpg", "figureLabel": "Local collaboration"}, {"kicker": "Subchapter 4.1.2", "title": "The positive ripple effect", "paragraphs": ["Did you know that seeing a colleague use a reusable bottle or choose a healthier menu often motivates more than any poster on the wall? Social leadership is built on mutual inspiration. It is not about judging others, but about celebrating small achievements that are easy to share. When one person takes the first step, others feel invited to join."], "figureSrc": "images/m4/m4-caso.jpg", "figureLabel": "Mutual inspiration"}, {"kicker": "Chapter 4.2", "title": "Practical ideas for a positive daily routine", "paragraphs": []}, {"kicker": "Subchapter 4.2.1", "title": "Small gestures in the office and on site", "paragraphs": ["Here are some simple ideas that are already working thanks to the initiative of many colleagues:", "Coffee and conversation: when you use your own mug instead of disposable cups, you reduce waste and make the habit visible in a natural way.", "Digital with purpose: sharing documents in the cloud instead of printing saves paper, supports teamwork and keeps workspaces clearer.", "The menu challenge: if you go to the canteen with your team, why not choose the vegetarian option together once a week? It becomes an easy reason to talk about new habits and new tastes."], "figureSrc": "images/m4/m4-hero.jpg", "figureLabel": "Small daily gestures"}, {"kicker": "Subchapter 4.2.2", "title": "Shared and active mobility", "paragraphs": ["Do you live near another colleague? Car-sharing can be a great opportunity to meet people from other departments, save money and reduce commuting stress. And if cycling is an option, it is often easier to start when others join the route with you."], "figureSrc": "images/m4/m4-apoyo.jpg", "figureLabel": "Shared mobility"}, {"kicker": "Chapter 4.3", "title": "Projects that bring us together: colleague-led initiatives", "paragraphs": []}, {"kicker": "Subchapter 4.3.1", "title": "Ideas that build community", "paragraphs": ["Daily life at Airbus is also shaped by activities that many people enjoy together:", "Sharing corners: creating places where books or objects we no longer use can be left for colleagues to give them a second life.", "Biodiversity workshops and informal meet-ups: using green spaces around our sites to learn more about local fauna and flora during breaks.", "Volunteering activities: taking part together in clean-up or reforestation days creates bonds that later make the working atmosphere much closer and more collaborative."], "figureSrc": "images/m4/m4-caso.jpg", "figureLabel": "Colleague initiatives"}], "practical": {"title": "PRACTICAL CONTENT: Launch your own idea!", "intro": "Activity title: The “Collaboration Wall”.\n\nInstructions: let’s create an open brainstorm.", "steps": ["Think of one small action you would like to propose to colleagues in order to encourage collaboration and care for the environment, for example a book-sharing point in the break area.", "Write it on the shared wall.", "Support the ideas from other colleagues that you find interesting."], "takeaway": "The key is connection between people. When something is authentic and grows out of collaboration, it has far more strength than any corporate label."}, "evaluation": {"title": "Reflection question", "question": "What is the most valuable ingredient for an initiative like this to work in your team?\n\nA) It has an official name and a logo.\n\nB) It comes from people who genuinely want to collaborate and it is easy to put in place together. (Correct answer)\n\nC) It is mandatory by contract.", "answer": "Feedback: Exactly. The key is human connection. When something is authentic and collaborative, it carries much more strength than any formal label."}, "closing": "Participation, idea sharing and everyday collaboration can transform the working environment in a close, positive and genuinely shared way."}, {"id": "m5", "index": "05", "title": "Transparency, reporting standards and greenwashing prevention", "objective": "Help employees identify and avoid greenwashing by understanding how sustainability efforts must be backed by scientific data and international reporting frameworks, ensuring corporate communication that is ethical, authentic and resilient under scrutiny.", "duration": "100–120 min", "tag": "Data integrity", "theme": {"ink": "#1a1823", "panel": "#f8f5fb", "soft": "#e8def4", "line": "#8b68b7", "accent": "#463065"}, "hero": "images/m5/m5-hero.jpg", "support": "images/m5/m5-apoyo.jpg", "case": "images/m5/m5-caso.jpg", "openingTitle": "Module objective", "openingParagraphs": ["Help employees identify and avoid greenwashing by understanding how sustainability efforts must be backed by scientific data and international reporting frameworks, ensuring corporate communication that is ethical, authentic and resilient under scrutiny."], "sections": [{"kicker": "Chapter", "title": "CHAPTER 5.1: The anatomy of greenwashing", "paragraphs": []}, {"kicker": "Subchapter 5.1.1", "title": "What is greenwashing, really?", "paragraphs": ["In aerospace, greenwashing is not only an image issue; it is a legal and financial compliance risk. It is the act of misleading stakeholders — employees, investors or customers — about a company’s environmental practices or the environmental benefits of a product or service.", "How to identify it:", "Vague claims: using terms such as “green flight”, “eco-friendly aircraft” or “clean” without defining specific metrics.", "Lack of evidence: announcing decarbonisation targets without detailing the technical roadmap or the associated investment.", "Irrelevant offsets: focusing communication on symbolic or purely marketing actions while avoiding disclosure about systemic supply-chain impacts or industrial water footprint."], "figureSrc": "images/m5/m5-apoyo.jpg", "figureLabel": "The anatomy of greenwashing"}, {"kicker": "Subchapter 5.1.2", "title": "The value of transparency: a “culture of data”", "paragraphs": ["At Airbus, honesty about technical challenges builds more trust than blind optimism. Admitting that full aviation decarbonisation is one of the hardest engineering challenges in human history is not weakness; it is integrity.", "Transparency means reporting both achievements and obstacles, recognising that sustainability goals are a path of continuous improvement rather than an advertising destination."], "figureSrc": "images/m5/m5-caso.jpg", "figureLabel": "Culture of data"}, {"kicker": "Chapter", "title": "CHAPTER 5.2: Scientific backing for Airbus targets", "paragraphs": []}, {"kicker": "Subchapter 5.2.1", "title": "Science-based commitments (SBTi and TCFD)", "paragraphs": ["To ensure Airbus targets are not perceived as greenwashing, they are aligned with rigorous international standards:", "SBTi (Science Based Targets initiative): Airbus commits to emission-reduction targets that are scientifically validated as compatible with the 1.5°C limit in the Paris Agreement. These are not merely desirable targets; they are targets required by climate physics.", "TCFD (Task Force on Climate-related Financial Disclosures): this framework requires us to disclose how climate risks affect financial stability. It is how we tell investors that we understand the risks and are preparing for them."], "figureSrc": "images/m5/m5-hero.jpg", "figureLabel": "Scientific backing for targets"}, {"kicker": "Subchapter 5.2.2", "title": "Global standards (GRI) and Scope 3", "paragraphs": ["Using standards such as GRI allows any external auditor to compare our performance objectively.", "The major present and future challenge is Scope 3 transparency. By honestly reporting indirect emissions and biodiversity impacts across our supply chain, we protect Airbus against accusations of hiding information and build a reputation grounded in operational reality rather than narrative."], "figureSrc": "images/m5/m5-apoyo.jpg", "figureLabel": "GRI and Scope 3"}, {"kicker": "Theoretical content", "title": "THEORETICAL CONTENT: Case studies and environmental policy", "paragraphs": []}, {"kicker": "Reading", "title": "When marketing collides with reality (real cases)", "paragraphs": ["To understand the seriousness of greenwashing, we can examine three legal and regulatory cases that set precedents in aviation:", "KLM case (Netherlands, 2024): a Dutch court ruled that KLM’s “Fly Responsibly” campaign was misleading. The airline suggested that its flights were sustainable or moving toward sustainability based on marginal SAF use and carbon-offsetting through reforestation. The court found those measures insufficient to justify such claims.", "Delta Air Lines case (United States, 2023): Delta has faced legal action over its claim to be the world’s first carbon-neutral airline. The challenge argued that the company relied too heavily on low-quality carbon credits and questionable offset methodologies that do not represent real atmospheric emission reductions.", "Etihad Airways case (United Kingdom, 2023): the Advertising Standards Authority banned Etihad ads claiming commitment to environmental protection because the wording was too broad and the airline failed to demonstrate that its operations did not significantly harm the environment.", "Lesson learned: terminological precision matters. At Airbus, phrases such as “impact reduction” or “energy transition” are often more defensible than claims of “neutral flight”, because they better reflect technical reality."], "figureSrc": "images/m5/m5-caso.jpg", "figureLabel": "Real greenwashing cases"}], "practical": {"title": "PRACTICAL CONTENT: Communication-audit workshop", "intro": "Activity title: Greenwashing Detector.\n\nInstructions: below is a fictional draft of an internal press release. Your mission is to identify the communication errors and rewrite it so that it becomes ethical and data-based.\n\nText to audit:\n\n“We are proud to launch the Airbus Future project. Thanks to seed kits distributed to employees on Earth Day, we have offset our operational footprint and become a 100% natural, impact-free company. We are the definitive solution for a sky without environmental trace.”", "steps": ["Challenge for the learner:", "Identify three greenwashing errors, for example “100% natural” is a vague claim; seed kits are an irrelevant compensation compared with industrial impact; “impact-free” is technically false.", "Rewrite the message using concrete data such as real emission-reduction percentages, SAF investment and verifiable ZEROe programme milestones."], "takeaway": "External validation and data rigour are the only real antidote to greenwashing."}, "evaluation": {"title": "Final evaluation question", "question": "What is Airbus’s strongest defence against accusations of greenwashing?\n\nA) Running advertising campaigns with many images of nature.\n\nB) Having our targets validated by external scientific bodies such as SBTi and reporting verifiable data under international standards. (Correct answer)\n\nC) Saying we are more sustainable than the competition.", "answer": "Feedback: Correct. External validation and data rigour are the only real antidote to greenwashing."}, "closing": "Ethical corporate communication is not built on grand claims. It is built on precise language, verifiable data and scientific frameworks that can withstand external scrutiny."}]};
const icons = {"m1": "🌍", "m2": "🛰️", "m3": "🌾", "m4": "🤝", "m5": "🛡️"};
const state = {view:'home', currentModule:null};
const qs = sel => document.querySelector(sel);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function parseSectionHeading(rawTitle,kicker){
  const colonIndex = rawTitle.indexOf(':');
  const prefix = colonIndex >= 0 ? rawTitle.slice(0, colonIndex).trim() : '';
  const rest = colonIndex >= 0 ? rawTitle.slice(colonIndex + 1).trim() : rawTitle;
  let cleanPrefix = prefix;
  const dotSpaceIndex = cleanPrefix.indexOf('. ');
  if(dotSpaceIndex>0){
    const maybeNumber = cleanPrefix.slice(0,dotSpaceIndex);
    const isOnlyDigits = [...maybeNumber].every(ch=>ch>='0'&&ch<='9');
    if(isOnlyDigits) cleanPrefix = cleanPrefix.slice(dotSpaceIndex+2);
  }
  if(cleanPrefix.toUpperCase().startsWith('CHAPTER ')) return {eyebrow:cleanPrefix.toUpperCase(), title:rest, isChapter:true};
  const isNumbered = prefix.length>0 && [...prefix].every(ch=>(ch>='0'&&ch<='9')||ch==='.');
  if(isNumbered) return {eyebrow:prefix,title:rest,isChapter:false};
  return {eyebrow:String(kicker||'').toUpperCase(), title:rawTitle, isChapter:String(kicker||'').toUpperCase()==='CHAPTER'};
}
function splitLeadText(text){const i=text.indexOf(':'); return i>0 && i<95 ? {lead:text.slice(0,i+1),rest:text.slice(i+1).trim()} : {lead:'',rest:text};}
function figureHtml(src,label,tone,tall=false){
  const cls = tall ? 'media' : 'media short';
  return `<div class="${cls}" style="border-color:${tone.line};background:${tone.soft}"><img src="${esc(src)}" alt="${esc(label)}" onerror="this.parentElement.innerHTML=window.figureFallback('${esc(label)}','${esc(tone.line)}','${esc(tone.soft)}','${esc(tone.panel)}')"><div class="label">${esc(label)}</div></div>`;
}
window.figureFallback=(label,line,soft,panel)=>`<div class="media short" style="border-color:${line};background:linear-gradient(135deg,${soft} 0%, #fff 55%, ${panel} 100%)"><div class="fallback"><div class="fallback-inner"><div class="ficon"></div><div class="label">${label}</div></div></div></div>`;
function renderParagraph(paragraph,accent){
  const trimmed = String(paragraph||'').trim(); if(!trimmed) return '';
  if(trimmed.startsWith('* ')){
    const parts=splitLeadText(trimmed.slice(2).trim());
    return `<div class="highlight"><div class="leadrow"><div class="dot" style="background:${accent}"></div><p>${parts.lead?`<strong>${esc(parts.lead)}</strong> `:''}${esc(parts.rest)}</p></div></div>`;
  }
  const isLetteredHeading = /^[A-Z]\.\s/.test(trimmed);
  if(isLetteredHeading) return `<div class="box-title">${esc(trimmed)}</div>`;
  const dotSpaceIndex = trimmed.indexOf('. ');
  if(dotSpaceIndex>0){
    const maybeNumber = trimmed.slice(0,dotSpaceIndex);
    const isOnlyDigits = [...maybeNumber].every(ch=>ch>='0'&&ch<='9');
    if(isOnlyDigits){
      const parts=splitLeadText(trimmed.slice(dotSpaceIndex+2));
      return `<div class="numbox"><div class="numrow"><div class="numbadge" style="background:${accent}18;color:${accent}">${esc(maybeNumber)}</div><p>${parts.lead?`<strong>${esc(parts.lead)}</strong> `:''}${esc(parts.rest)}</p></div></div>`;
    }
  }
  if(trimmed.endsWith(':')) return `<div class="box-title">${esc(trimmed)}</div>`;
  const parts=splitLeadText(trimmed); const hasLead=!!parts.lead && parts.lead.length<80;
  if(hasLead) return `<div class="highlight"><div class="leadrow"><div class="dot" style="background:${accent}"></div><p><strong>${esc(parts.lead)}</strong> ${esc(parts.rest)}</p></div></div>`;
  return `<div class="para"><p>${esc(trimmed)}</p></div>`;
}
function homeHtml(){
  const c=DATA.course, mods=DATA.modules;
  return `<section class="grid-home"><div class="hero"><div class="hero-grid"><div class="hero-copy"><div class="chips"><span class="chip">Biodiversity and sustainability</span></div><div style="height:20px"></div><h1>Biodiversidad,<br>sostenibilidad<br>y criterio técnico.</h1><p>${esc(c.intro)}</p><button class="cta" onclick="goProgram()">Open programme →</button></div><div class="map hero-map"><div class="eyebrow">Course map</div>${mods.map(m=>`<div class="map-card"><div class="map-line"><div class="map-badge">${icons[m.id]||'•'}</div><div><div class="eyebrow" style="color:rgba(255,255,255,.45)">${esc(m.index)}</div><div style="margin-top:4px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.88)">${esc(m.title)}</div></div></div></div>`).join('')}</div></div></div><div class="side-card"><div class="eyebrow">Structure</div><h2 style="margin:12px 0 0;font-size:36px;line-height:1.02;letter-spacing:-.02em;color:#1a1d23">How it is organised</h2><div style="margin-top:24px;display:grid;gap:12px">${c.structure.map((item,i)=>`<div class="small-card"><div style="display:flex;gap:12px;align-items:flex-start"><div class="counter">0${i+1}</div><p style="margin:0;font-size:14px;line-height:2;color:#475569">${esc(item)}</p></div></div>`).join('')}</div></div></section>`;
}
function programHtml(){
  const mods=DATA.modules;
  return `<section class="program-header"><div class="eyebrow">Programme</div><h1>Course journey</h1><p style="max-width:850px;font-size:16px;line-height:2;color:#475569">Five thematic modules with developed theory, a case study or applied activity, and short evaluation with technical feedback.</p></section><div style="height:24px"></div><section class="program-list">${mods.map(m=>{
      return `<article class="program-card"><div class="program-grid"><div class="media-wrap" style="background:${m.theme.panel}">${figureHtml(m.hero,`${m.index} · hero`,m.theme,true)}</div><div class="program-body"><div class="p-top"><div style="display:flex;gap:12px;align-items:center"><div class="module-icon" style="background:${m.theme.soft}">${icons[m.id]||'•'}</div><div><div class="eyebrow">Module ${esc(m.index)}</div><div style="margin-top:4px;font-size:14px;color:#64748b">${esc(m.duration)}</div></div></div><span class="tag" style="background:${m.theme.soft};color:${m.theme.accent}">${esc(m.tag)}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.objective)}</p><div class="section-preview">${m.sections.slice(0,4).map(s=>{const h=parseSectionHeading(s.title,s.kicker);return `<div class="section-box"><div class="eyebrow">${esc(h.eyebrow)}</div><div style="margin-top:8px;font-size:14px;line-height:1.7;color:#1f2937;font-weight:500">${esc(h.title)}</div></div>`}).join('')}</div><div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"><button class="open-btn" style="background:${m.theme.accent}" onclick="openModule('${m.id}')">Open module →</button><span style="font-size:14px;color:#64748b">Extended theory · applied case · self-assessment</span></div></div></div></article>`
    }).join('')}</section>`;
}
function articleHtml(section,module){
  const h=parseSectionHeading(section.title,section.kicker);
  const paras=(section.paragraphs||[]).map(p=>renderParagraph(p,module.theme.accent)).join('');
  if(h.isChapter) return `<section class="article-card"><div class="chapter-head" style="border-color:${module.theme.accent};background:${module.theme.panel}"><div class="eyebrow" style="color:${module.theme.accent}">${esc(h.eyebrow)}</div><h3 style="margin:12px 0 0;font-size:30px;line-height:1.08;letter-spacing:-.02em;color:#1b1e25">${esc(h.title)}</h3></div>${section.paragraphs&&section.paragraphs.length?`<div class="article-content"><div class="block-list">${paras}</div>${section.figureSrc?`<div style="margin-top:24px">${figureHtml(section.figureSrc,section.figureLabel||'Apoyo visual',module.theme,true)}</div>`:''}</div>`:''}</section>`;
  return `<section class="article-card"><div class="article-grid"><div class="article-side" style="background:${module.theme.soft}"><div><div class="eyebrow">Section</div><div style="margin-top:8px;font-size:24px;font-weight:700;color:${module.theme.accent}">${esc(h.eyebrow)}</div></div></div><div class="article-content"><h3>${esc(h.title)}</h3><div class="block-list">${paras}</div>${section.figureSrc?`<div style="margin-top:24px">${figureHtml(section.figureSrc,section.figureLabel||'Apoyo visual',module.theme,true)}</div>`:''}</div></div></section>`;
}
function practicalHtml(module){ if(!module.practical) return ''; const p=module.practical; return `<section class="article-card"><div class="article-grid"><div class="article-side" style="background:${module.theme.soft}"><div><div style="font-size:18px;color:${module.theme.accent}">🗂️</div><div class="eyebrow" style="margin-top:12px">Practice</div></div></div><div class="article-content"><h3>${esc(p.title)}</h3><p style="white-space:pre-line;font-size:16px;line-height:2;color:#475569">${esc(p.intro)}</p><div class="practical-steps">${p.steps.map((s,i)=>`<div class="section-box"><div class="eyebrow">Step 0${i+1}</div><p style="margin:8px 0 0;font-size:14px;line-height:2;color:#475569">${esc(s)}</p></div>`).join('')}</div><div style="margin-top:20px" class="highlight"><p><strong>Lesson:</strong> ${esc(p.takeaway)}</p></div></div></div></section>`; }
function evaluationHtml(module){ if(!module.evaluation) return ''; const e=module.evaluation; return `<section class="article-card"><div class="article-grid"><div class="article-side" style="background:${module.theme.soft}"><div><div style="font-size:18px;color:${module.theme.accent}">📝</div><div class="eyebrow" style="margin-top:12px">Evaluation</div></div></div><div class="article-content"><h3>${esc(e.title)}</h3><div class="section-box" style="margin-top:20px"><div class="eyebrow">Question</div><p style="margin:12px 0 0;white-space:pre-line;font-size:16px;line-height:2;color:#334155">${esc(e.question)}</p></div><div style="margin-top:16px" class="highlight"><div class="leadrow"><div style="font-size:18px;line-height:1;color:${module.theme.accent}">✔</div><p>${esc(e.answer)}</p></div></div></div></div></section>`; }
function moduleHtml(module){
  const nextIndex=DATA.modules.findIndex(x=>x.id===module.id)+1;
  const next=DATA.modules[nextIndex]||null;
  return `<div class="module-layout"><aside class="sticky stack"><div class="meta-dark"><div style="display:flex;gap:12px;align-items:center"><div class="module-icon" style="border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.05)">${icons[module.id]||'•'}</div><div><div class="eyebrow" style="color:rgba(255,255,255,.45)">Module ${esc(module.index)}</div><div style="margin-top:4px;font-size:14px;color:rgba(255,255,255,.65)">${esc(module.duration)}</div></div></div><h2 style="margin:20px 0 0;font-size:28px;line-height:1.08;color:#f8f3ec">${esc(module.title)}</h2><p style="font-size:14px;line-height:2;color:rgba(255,255,255,.7)">${esc(module.objective)}</p><div style="margin-top:20px"><span class="chip">${esc(module.tag)}</span></div></div></aside><div class="stack"><section class="article-card"><div class="program-grid" style="grid-template-columns:1.05fr .95fr"><div style="padding:24px 32px;background:${module.theme.panel}"><div class="eyebrow">Module opening</div><h1 style="margin:12px 0 0;max-width:900px;font-size:58px;line-height:.98;letter-spacing:-.04em;color:#1b1e25">${esc(module.title)}</h1>${module.openingTitle&&module.openingParagraphs?`<h2 style="margin:24px 0 0;font-size:32px;line-height:1.08;letter-spacing:-.02em;color:#1b1e25">${esc(module.openingTitle)}</h2><div class="block-list" style="margin-top:16px">${module.openingParagraphs.map(p=>renderParagraph(p,module.theme.accent)).join('')}</div>`:`<p style="margin-top:20px;font-size:16px;line-height:2;color:#475569">${esc(module.objective)}</p>`}</div><div class="media-wrap" style="background:${module.theme.soft}">${figureHtml(module.hero,`${module.index} · hero`,module.theme,true)}</div></div></section>${module.sections.map(s=>articleHtml(s,module)).join('')}${practicalHtml(module)}${evaluationHtml(module)}${module.closing?`<section class="footer-close"><div class="eyebrow" style="color:rgba(255,255,255,.45)">Closing</div><p style="margin:16px 0 0;font-size:16px;line-height:2;color:rgba(255,255,255,.78)">${esc(module.closing)}</p></section>`:''}<section class="meta-white"><div class="eyebrow">Navigation</div><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center"><button class="small-card" style="padding:12px 16px;text-align:left" onclick="goProgram()">← Programme</button>${next?`<button class="open-btn" style="background:#020617;justify-content:center" onclick="openModule('${next.id}')">Next →</button>`:''}</div></section></div></div>`;
}
function setActiveNav(){ qs('#nav-home').classList.toggle('active',state.view==='home'); qs('#nav-program').classList.toggle('active',state.view==='program'||state.view.startsWith('m')); }
function render(){
  qs('#brand-title').textContent=DATA.course.title; qs('#brand-sub').textContent=DATA.course.subtitle;
  qs('#home-view').innerHTML=homeHtml();
  qs('#program-view').innerHTML=programHtml();
  qs('#module-view').innerHTML=state.currentModule?moduleHtml(state.currentModule):'';
  qs('#home-view').classList.toggle('hidden',state.view!=='home');
  qs('#program-view').classList.toggle('hidden',state.view!=='program');
  qs('#module-view').classList.toggle('hidden',!state.currentModule);
  setActiveNav();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goHome(){state.view='home'; state.currentModule=null; render();}
function goProgram(){state.view='program'; state.currentModule=null; render();}
function openModule(id){ const m=DATA.modules.find(x=>x.id===id); state.view=id; state.currentModule=m||null; render(); }
window.goHome=goHome; window.goProgram=goProgram; window.openModule=openModule;
qs('#nav-home').onclick=goHome; qs('#nav-program').onclick=goProgram;
render();
</script>
</body>
</html>
